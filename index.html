<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Minesweeper</title>
<meta name="description" content="A minesweeper for the browser with a built-in solver that teaches the rules, shows mine chances and can play for you.">
<meta name="theme-color" content="#060607">
<meta property="og:title" content="Minesweeper">
<meta property="og:description" content="A minesweeper for the browser with a built-in solver that teaches the rules, shows mine chances and can play for you.">
<meta property="og:image" content="https://cubicobelus.github.io/minesweeper/docs/screenshot.jpg">
<meta property="og:url" content="https://cubicobelus.github.io/minesweeper/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23060607'/%3E%3Cpath d='M11 7v19' stroke='%23d4af37' stroke-width='2.4' stroke-linecap='round'/%3E%3Cpath d='M12 8l12 5.5L12 19z' fill='%23d4af37'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #060607;
    --surface: #111112;
    --cell: #2b2b2f;
    --cell-hi: #3a3a3f;
    --cell-hover: #46464c;
    --open: #000;
    --line: #26262a;
    --text: #f5f5f2;
    --dim: #8a8a86;
    --accent: #d4af37;
    --red: #c23b32;
    --num: ui-monospace, "Cascadia Mono", Consolas, "SF Mono", monospace;
    --size: 36px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { scrollbar-gutter: stable; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Inter", "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 40px 12px 120px;
    user-select: none; -webkit-user-select: none;
  }
  .wrap { position: relative; display: flex; flex-direction: column; align-items: stretch; max-width: 100%; }
  h1 { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 0 0 22px; font-size: .78rem; font-weight: 600; letter-spacing: .38em; text-transform: uppercase; }
  h1 svg { color: var(--accent); }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 14px; flex-wrap: wrap; }
  .tabs { display: flex; justify-content: center; gap: 22px; margin-bottom: 18px; border-bottom: 1px solid var(--line); }
  .tabs button { font: inherit; font-size: .85rem; font-weight: 500; color: var(--dim); background: none; border: 0; padding: 0 0 10px; margin-bottom: -1px; cursor: pointer; border-bottom: 2px solid transparent; transition: color .15s; }
  .tabs button:hover { color: var(--text); }
  .tabs button.on { color: var(--text); border-bottom-color: var(--accent); }
  .modes { display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
  .modes button {
    font: inherit; font-size: .8rem; font-weight: 500; color: var(--dim); background: none;
    border: 0; border-radius: 7px; padding: 6px 14px; cursor: pointer; transition: color .15s, background .15s;
  }
  .modes button:hover { color: var(--text); }
  .modes button.on { color: var(--text); background: var(--cell-hi); }
  .stats { display: flex; align-items: center; gap: 18px; font-size: .85rem; color: var(--dim); font-variant-numeric: tabular-nums; }
  .stats b { color: var(--text); font-weight: 600; margin-left: 6px; }
  #face {
    font: inherit; font-size: .8rem; font-weight: 500; color: var(--bg); background: var(--text);
    border: 0; border-radius: 8px; padding: 6px 14px; cursor: pointer; transition: opacity .15s;
  }
  #face:hover { opacity: .85; }
  .scroller { align-self: center; width: fit-content; max-width: 100%; overflow: auto; padding: 10px; border-radius: 16px; background: #000; border: 1px solid rgba(255,255,255,.08); }
  #board { display: grid; gap: 3px; touch-action: manipulation; }
  .c {
    position: relative; width: var(--size); height: var(--size); border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--num); font-weight: 700; font-size: calc(var(--size) * .5); font-variant-numeric: tabular-nums;
    background: linear-gradient(160deg, var(--cell-hi), var(--cell)); box-shadow: inset 0 1px 0 rgba(255,255,255,.1), inset 0 -2px 0 rgba(0,0,0,.3); cursor: pointer; transition: background .12s, box-shadow .12s;
  }
  .c:hover:not(.open) { background: linear-gradient(160deg, var(--cell-hover), var(--cell-hi)); box-shadow: inset 0 0 0 1px rgba(212,175,55,.3); }
  .c.open { background: var(--open); box-shadow: none; cursor: default; }
  .c.adj:not(.open) { background: #36342d; box-shadow: inset 0 0 0 1px rgba(212,175,55,.14); }
  .c.adj.open { background: #0d0c08; }
  .c.flag, .c.flag:hover, .c.flag.adj { background: #000; box-shadow: inset 0 0 0 1px rgba(255,255,255,.07); }
  .c.flag.adj { box-shadow: inset 0 0 0 1px rgba(212,175,55,.2); }
  .c.flag::before {
    content: ""; width: 0; height: 0; margin-left: 3px;
    border-left: 11px solid var(--accent); border-top: 6px solid transparent; border-bottom: 6px solid transparent;
  }
  .c.flag::after { content: ""; position: absolute; width: 2px; height: 16px; background: var(--accent); left: calc(50% - 7px); top: calc(50% - 8px); border-radius: 1px; }
  .c.anim { animation: clear .28s ease-out backwards; }
  @keyframes clear {
    from { background: var(--cell); color: transparent; box-shadow: inset 0 1px 0 rgba(255,255,255,.08); transform: scale(1); }
    40% { background: var(--cell); transform: scale(.8); }
    to { transform: scale(1); }
  }
  @keyframes dot { from { transform: scale(0); } 70% { transform: scale(1.25); } to { transform: scale(1); } }
  .c.flag::before, .c.flag::after { animation: dot .18s ease-out; }
  .c.sure, .c.sure:hover:not(.open), .c.sure.adj:not(.open) { background: #8c2f2a; box-shadow: inset 0 1px 0 rgba(255,255,255,.12), inset 0 -2px 0 rgba(0,0,0,.2); }
  .c.sure:hover:not(.open) { background: #a33a33; }
  .c.sure.adj:not(.open) { box-shadow: inset 0 0 0 1px rgba(255,255,255,.2); }
  .c.safe, .c.safe:hover:not(.open), .c.safe.adj:not(.open) { background: #c9a227; box-shadow: inset 0 1px 0 rgba(255,255,255,.18), inset 0 -2px 0 rgba(0,0,0,.2); }
  .c.safe:hover:not(.open) { background: #dcb73c; }
  .c.safe.adj:not(.open) { box-shadow: inset 0 0 0 1px rgba(0,0,0,.25); }
  .c.safe::before { content: ""; width: 8px; height: 15px; border: solid rgba(24,16,0,.8); border-width: 0 3px 3px 0; transform: rotate(45deg) translate(-2px, -2px); }
  .c.pct { font-family: var(--num); font-size: calc(var(--size) * .3); font-weight: 600; letter-spacing: -.03em; }
  .c.pct.mid { color: rgba(245,245,242,.45); }
  .c.pct.lo { color: rgba(212,175,55,.9); }
  .c.pct.hi { color: rgba(226,120,110,.9); }
  .c.safe.pct { color: #181000; }
  .c.safe.pct::before { display: none; }
  .mt.p { font-size: .58rem; letter-spacing: -.04em; color: var(--dim); }
  .c.why { box-shadow: inset 0 0 0 1px rgba(212,175,55,.6); }
  .box, .rule { border: 1px solid var(--line); border-radius: 12px; background: #101011; color: var(--dim); transition: border-color .15s, background .15s, color .15s; }
  .box { display: block; width: 100%; margin-bottom: 8px; text-align: left; font: inherit; font-size: .85rem; padding: 11px 12px; cursor: pointer; }
  .box small { display: block; margin-top: 2px; font-size: .7rem; color: var(--dim); }
  .box.on, .rule.on { border-color: rgba(212,175,55,.7); background: rgba(212,175,55,.09); color: var(--text); }
  #rules { position: fixed; z-index: 20; left: 0; top: 0; bottom: 0; width: min(330px, 88vw); background: #09090a; border-right: 1px solid var(--line); transform: translateX(-100%); transition: transform .25s ease; }
  #rules.open { transform: none; box-shadow: 12px 0 40px rgba(0,0,0,.6); }
  #rtab { position: absolute; left: 100%; top: 110px; writing-mode: vertical-rl; padding: 16px 8px; font: inherit; font-size: .72rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); background: #09090a; border: 1px solid var(--line); border-left: 0; border-radius: 0 10px 10px 0; cursor: pointer; }
  #rtab:hover { color: #000; background: var(--accent); }
  .rin { height: 100%; overflow: auto; padding: 18px 14px 40px; }
  .rule { position: relative; margin-bottom: 8px; }
  .how { position: absolute; right: 8px; top: 9px; padding: 4px 8px; background: none; border: 0; border-radius: 6px; font: inherit; font-size: .7rem; color: var(--dim); cursor: pointer; }
  .how:hover { color: var(--text); background: rgba(255,255,255,.07); }
  .slide { display: flex; align-items: center; gap: 10px; padding: 2px 4px 0; font-size: .78rem; color: var(--dim); }
  .slide input { flex: 1; accent-color: var(--accent); }
  .slide b { width: 52px; text-align: right; font-weight: 500; color: var(--text); font-variant-numeric: tabular-nums; }
  #statsbtn { font: inherit; font-size: .74rem; color: var(--dim); background: none; border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; cursor: pointer; }
  #statsbtn:hover { color: var(--text); border-color: #3a3a3f; }
  #statsmodal { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; background: rgba(0,0,0,.68); }
  #statsmodal[hidden] { display: none; }
  .card { position: relative; min-width: min(400px, 90vw); padding: 22px 24px; background: #0d0d0e; border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.7); }
  .card h2 { margin: 0 0 14px; font-size: .74rem; font-weight: 600; letter-spacing: .3em; text-transform: uppercase; }
  .card table { width: 100%; border-collapse: collapse; font-size: .82rem; font-variant-numeric: tabular-nums; }
  .card th { padding: 4px 0 8px; color: var(--dim); font-weight: 500; text-align: right; }
  .card td { padding: 7px 0; text-align: right; border-top: 1px solid var(--line); }
  .card th:first-child, .card td:first-child { text-align: left; }
  .srow { display: flex; justify-content: space-between; padding-top: 10px; font-size: .82rem; color: var(--dim); }
  .srow b { font-weight: 500; color: var(--text); }
  #statsclose { position: absolute; right: 12px; top: 8px; background: none; border: 0; color: var(--dim); font-size: 1.3rem; cursor: pointer; }
  #statsclose:hover { color: var(--text); }
  #statsreset { margin-top: 18px; background: none; border: 1px solid var(--line); border-radius: 8px; padding: 5px 12px; font: inherit; font-size: .72rem; color: var(--dim); cursor: pointer; }
  .sep { height: 1px; margin: 14px 0; background: var(--line); }
  .rbox { display: flex; align-items: center; gap: 10px; width: 100%; padding: 11px 12px; background: none; border: 0; color: inherit; font: inherit; font-size: .85rem; text-align: left; cursor: pointer; }
  .rbox b { flex: none; display: grid; place-items: center; width: 20px; height: 20px; border-radius: 6px; background: #232326; color: var(--dim); font-size: .72rem; }
  .rule.on .rbox b { background: var(--accent); color: #000; }
  .lesson { padding: 0 12px 12px 42px; color: var(--dim); font-size: .76rem; line-height: 1.5; }
  .lesson p { margin: 8px 0; }
  .mg { display: grid; grid-template-columns: repeat(var(--cols), 24px); gap: 3px; margin: 8px 0 2px; }
  .mt { width: 24px; height: 24px; border-radius: 6px; background: var(--cell); display: flex; align-items: center; justify-content: center; font: 700 .78rem var(--num); font-style: normal; }
  .mt.o { background: #000; }
  .mt.m { background: #8c2f2a; color: #fff; }
  .mt.s { background: #c9a227; color: #181000; }
  .mt.gap { visibility: hidden; }
  .eb { height: 16px; border-radius: 8px; font-size: .62rem; line-height: 16px; text-align: center; color: #000; font-weight: 600; }
  .eb.a { background: var(--accent); }
  .eb.b { background: #9a9a95; }
  .chip { display: inline-block; margin-top: 6px; padding: 3px 8px; border-radius: 8px; background: #000; color: var(--text); font-size: .7rem; }
  #capnote { margin-top: 10px; color: var(--accent); font-size: .72rem; }
  #why { width: 0; min-width: 100%; min-height: 2.6em; margin-top: 8px; text-align: center; color: var(--dim); font-size: .78rem; line-height: 1.45; }
  #why b { color: var(--text); font-weight: 600; }
  .c.mine::before { animation: dot .3s ease-out backwards; animation-delay: var(--md, 0ms); }
  @keyframes wave { 0%, 100% { transform: scale(1); } 40% { transform: scale(1.2); box-shadow: 0 0 16px rgba(212,175,55,.75); } }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-7px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(2px); } }
  .scroller.shake { animation: shake .42s ease-out; }
  @media (prefers-reduced-motion: reduce) { .scroller.shake, .c.anim, .c.flag::before, .c.flag::after, .c.mine::before { animation: none; } }
  .c.mine::before { content: ""; width: 38%; height: 38%; border-radius: 50%; background: var(--red); }
  .c.boom { background: rgba(194,59,50,.3); }
  .c.wrong::before { content: ""; width: 38%; height: 2px; background: var(--red); transform: rotate(-45deg); }
  .c.wrong::after { content: ""; position: absolute; width: 38%; height: 2px; background: var(--red); transform: rotate(45deg); }
  .c.wrong { background: rgba(194,59,50,.12); }
  .c.win.flag::before { border-left-color: #f0d36a; }
  .c.win.flag::after { background: #f0d36a; }
  .n1 { color: #6ea8ff; } .n2 { color: #5fd39a; } .n3 { color: #ff7a7a; } .n4 { color: #b394ff; }
  .n0 { color: #3a3a36; } .neg { color: var(--red); }
  .n5 { color: #ffb86b; } .n6 { color: #5fd3d3; } .n7 { color: #e5e5ea; } .n8 { color: #8a8a96; }
  #msg { text-align: center; height: 1.4em; margin-top: 14px; font-size: .85rem; font-weight: 500; color: var(--dim); }
  #msg.win { color: var(--accent); }
  #msg.lose { color: var(--red); }
  .hint { width: 0; min-width: 100%; text-align: center; margin-top: 4px; color: var(--dim); font-size: .75rem; opacity: .7; }
  #tapmode { display: none; align-self: center; margin-top: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
  #tapmode button { font: inherit; font-size: .8rem; font-weight: 500; color: var(--dim); background: none; border: 0; border-radius: 7px; padding: 8px 26px; cursor: pointer; }
  #tapmode button.on { color: var(--text); background: var(--cell-hi); }
  #tapmode button.on[data-m="flag"] { color: #000; background: var(--accent); }
  @media (pointer: coarse), (max-width: 700px) { #tapmode { display: flex; } }
  @media (max-width: 700px) { #rtab { top: auto; bottom: 18px; } .top { flex-direction: column; align-items: center; gap: 12px; } .stats { flex-wrap: wrap; justify-content: center; gap: 10px 14px; } }
  @media (max-width: 520px) { :root { --size: 30px; } }
</style>
</head>
<body>
<div class="wrap">
  <h1><svg viewBox="0 0 14 16" width="14" height="16" aria-hidden="true"><path d="M2 1v14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M3 2l9 4-9 4z" fill="currentColor"/></svg>minesweeper</h1>
  <div class="tabs" id="tabs"></div>
  <div class="top">
    <div class="modes" id="modes"></div>
    <div class="stats">
      <button id="statsbtn">Stats</button>
      <span>Best<b id="best">---</b></span>
      <span>Mines<b id="mines">010</b></span>
      <span>Time<b id="time">000</b></span>
      <button id="face">New game</button>
    </div>
  </div>
  <div class="scroller"><div id="board"></div></div>
  <div id="msg"></div>
  <div id="why"></div>
  <div id="tapmode"><button class="on" data-m="dig">Dig</button><button data-m="flag">Flag</button></div>
  <div class="hint" id="exp" hidden></div>
</div>
<div id="statsmodal" hidden>
  <div class="card">
    <button id="statsclose" aria-label="Close">&times;</button>
    <h2>Stats</h2>
    <div id="statsbody"></div>
    <button id="statsreset">Reset</button>
  </div>
</div>
<aside id="rules">
  <button id="rtab">Rules</button>
  <div class="rin">
    <button class="box" id="allrules">All</button>
    <div id="rulelist"></div>
    <div class="sep"></div>
    <button class="box" id="autochord" title="Hovering a number acts like a middle-click">Hover chord</button>
    <button class="box" id="autosweep" title="Clears around every number whose flags match, without hovering">Auto chord</button>
    <button class="box" id="autoflag" title="Places a flag on every red mine">Auto flag</button>
    <button class="box" id="autoopen" title="Opens every certain safe tile">Auto open</button>
    <label class="slide" title="Pause between automatic moves"><span>Delay</span><input type="range" id="autodelay" min="0" max="20" step="1" value="0"><b id="delayval">0 ms</b></label>
    <div id="capnote" hidden>Rule 6 skipped some tangled areas.</div>
  </div>
</aside>

<script>
const MODES = {
  Easy:   { w: 9,  h: 9,  m: 10 },
  Medium: { w: 16, h: 16, m: 40 },
  Hard:   { w: 30, h: 16, m: 99 },
};
let view = "classic", marks = new Map(), chances = new Map(), capped = false, whySet = new Set(), whyTile = null, experimental = false, autoChord = false, autoAll = false, sweeping = false, autoFlag = false, autoOpen = false, autoDelay = 0, autoTimer = null, autoBusy = false, tapFlag = false, lastTile = null, assisted = false, stats = {}, bests = {}, hover = null, hl = null, midPos = null, midHeld = false, mode = "Easy", W, H, M, grid, cells, started, over, flags, revealed, timer, secs;

const $ = id => document.getElementById(id);
const boardEl = $("board");

function pad(n) { return String(Math.max(0, Math.min(999, n))).padStart(3, "0"); }

const VIEWS = [
  ["classic", "Classic", ""],
  ["experimental", "Experimental", "Flags subtract from nearby numbers."],
];

function buildTabs() {
  $("tabs").innerHTML = "";
  VIEWS.forEach(([id, name, hint]) => {
    const b = document.createElement("button");
    b.textContent = name;
    b.className = id === view ? "on" : "";
    b.onclick = () => {
      view = id; experimental = id === "experimental"; buildTabs();
      $("exp").hidden = !hint; $("exp").textContent = hint;
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (grid[y][x].open) paint(x, y);
      refreshMarks();
    };
    $("tabs").appendChild(b);
  });
}

function buildModes() {
  $("modes").innerHTML = "";
  for (const name in MODES) {
    const b = document.createElement("button");
    b.textContent = name;
    b.className = name === mode ? "on" : "";
    b.onclick = () => { mode = name; buildModes(); reset(); };
    $("modes").appendChild(b);
  }
}

function reset() {
  ({ w: W, h: H, m: M } = MODES[mode]);
  clearInterval(timer);
  clearTimeout(autoTimer); autoTimer = null;
  assisted = false; lastTile = null;
  document.querySelector(".scroller").classList.remove("shake");
  hover = hl = midPos = null; midHeld = false; marks = new Map(); chances = new Map(); capped = false; whySet = new Set(); whyTile = null;
  secs = 0; started = false; over = false; flags = 0; revealed = 0;
  grid = Array.from({ length: H }, () => Array.from({ length: W }, () => ({ mine: false, n: 0, open: false, flag: false })));
  boardEl.style.gridTemplateColumns = `repeat(${W}, var(--size))`;
  boardEl.innerHTML = "";
  cells = [];
  for (let y = 0; y < H; y++) {
    cells.push([]);
    for (let x = 0; x < W; x++) {
      const el = document.createElement("div");
      el.className = "c";
      el.dataset.x = x; el.dataset.y = y;
      boardEl.appendChild(el);
      cells[y].push(el);
    }
  }
  $("time").textContent = "000";
  $("mines").textContent = pad(M);
  showBest();
  $("msg").textContent = ""; $("msg").className = "";
  showWhy(null);
}

function neighbors(x, y) {
  const out = [];
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
    if (!dx && !dy) continue;
    const nx = x + dx, ny = y + dy;
    if (nx >= 0 && ny >= 0 && nx < W && ny < H) out.push([nx, ny]);
  }
  return out;
}

function plant(sx, sy) {
  const safe = new Set([sx + "," + sy, ...neighbors(sx, sy).map(([a, b]) => a + "," + b)]);
  let placed = 0;
  while (placed < M) {
    const x = Math.floor(Math.random() * W), y = Math.floor(Math.random() * H);
    if (grid[y][x].mine || safe.has(x + "," + y)) continue;
    grid[y][x].mine = true; placed++;
  }
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++)
    grid[y][x].n = neighbors(x, y).filter(([a, b]) => grid[b][a].mine).length;
  timer = setInterval(() => { secs++; $("time").textContent = pad(secs); }, 1000);
  started = true;
}

function paint(x, y) {
  const c = grid[y][x], el = cells[y][x];
  el.className = "c";
  el.textContent = "";
  const mk = !c.open && !c.flag ? marks.get(y * W + x) : null;
  if (mk) el.classList.add(mk.kind === "mine" ? "sure" : "safe");
  const pr = rules.chance && !c.open && !c.flag && !(mk && mk.kind === "mine") ? chances.get(y * W + x) : undefined;
  if (pr !== undefined) { el.textContent = pctText(pr); el.classList.add("pct", pr < 0.15 ? "lo" : pr >= 0.6 ? "hi" : "mid"); }
  if (whySet.has(y * W + x)) el.classList.add("why");
  if (hl && Math.max(Math.abs(hl[0] - x), Math.abs(hl[1] - y)) === 1) el.classList.add("adj");
  if (c.open) {
    el.classList.add("open");
    if (c.n) {
      const v = experimental ? c.n - neighbors(x, y).filter(([a, b]) => grid[b][a].flag).length : c.n;
      el.textContent = v;
      el.classList.add(v < 0 ? "neg" : "n" + v);
    }
    if (c.t0) {
      const e = performance.now() - c.t0;
      if (e < c.d + 280) { el.classList.add("anim"); el.style.animationDelay = (c.d - e) + "ms"; }
      else c.t0 = 0;
    }
  } else if (c.flag) el.classList.add("flag");
}

// ---- mine finder: six rules, each can be switched off ----
const RULE_IDS = ["full", "satisfied", "subset", "overlap", "count", "enumerate", "chance"];
let rules = { full: false, satisfied: false, subset: false, overlap: false, count: false, enumerate: false, chance: false };
try {
  const saved = JSON.parse(localStorage.getItem("mfRules2"));
  if (saved) for (const id of RULE_IDS) if (typeof saved[id] === "boolean") rules[id] = saved[id];
} catch (e) {}

// Every opened number is a constraint: its closed neighbours hold exactly `need` mines.
// cons: [{S: Set of closed tile ids, S0: the same at the start, need, n: number shown, src: id of that number}]
// closed: ids of every closed tile, M: total mines. Returns {marks: Map(tile -> {kind, rule, info, nums}), capped}.
function infer(cons, closed, M, on) {
  const marks = new Map();
  let capped = false, probs = null;
  const numsOf = t => cons.filter(k => k.S0.has(t)).map(k => k.src);
  let relabel = null;
  const mark = (t, kind, rule, info, nums) => {
    if (marks.has(t)) return false;
    if (relabel) { rule = relabel; info = {}; nums = numsOf(t); }
    marks.set(t, { kind, rule, info, nums });
    return true;
  };
  const snap = k => ({ n: k.n, need: k.need, size: k.S.size });

  const simple = on => {
    for (let changed = true; changed;) {
      changed = false;
      for (const k of cons) for (const t of [...k.S]) {
        const m = marks.get(t);
        if (m) { k.S.delete(t); if (m.kind === "mine") k.need--; }
      }
      const idx = new Map();
      for (const k of cons) for (const t of k.S) { if (!idx.has(t)) idx.set(t, []); idx.get(t).push(k); }
      for (const k of cons) {
        if (!k.S.size) continue;
        if (on.full && k.need === k.S.size) { for (const t of k.S) if (mark(t, "mine", "full", snap(k), [k.src])) changed = true; }
        else if (on.satisfied && k.need === 0) { for (const t of k.S) if (mark(t, "safe", "satisfied", snap(k), [k.src])) changed = true; }
      }
      if (on.subset || on.overlap) for (const A of cons) {
        if (!A.S.size) continue;
        const seen = new Set();
        for (const t of A.S) for (const B of idx.get(t)) {
          if (B === A || seen.has(B)) continue;
          seen.add(B);
          let I = 0;
          for (const u of A.S) if (B.S.has(u)) I++;
          const aOnly = A.S.size - I, bOnly = B.S.size - I;
          if (aOnly === 0 && bOnly > 0) {
            if (!on.subset) continue;
            const dn = B.need - A.need, info = { a: snap(A), b: snap(B), dn, size: bOnly };
            const D = [...B.S].filter(u => !A.S.has(u));
            if (dn === 0) { for (const u of D) if (mark(u, "safe", "subset", info, [A.src, B.src])) changed = true; }
            else if (dn === bOnly) { for (const u of D) if (mark(u, "mine", "subset", info, [A.src, B.src])) changed = true; }
          } else if (aOnly > 0 && bOnly > 0 && I > 0 && on.overlap && A.need - B.need === aOnly) {
            const info = { a: snap(A), b: snap(B), size: aOnly };
            for (const u of A.S) if (!B.S.has(u) && mark(u, "mine", "overlap", info, [A.src, B.src])) changed = true;
            for (const u of B.S) if (!A.S.has(u) && mark(u, "safe", "overlap", info, [A.src, B.src])) changed = true;
          }
        }
      }
      if (on.count) {
        let mc = 0;
        const unk = [];
        for (const t of closed) { const m = marks.get(t); if (!m) unk.push(t); else if (m.kind === "mine") mc++; }
        const rem = M - mc, info = { rem, unknown: unk.length };
        if (unk.length && rem === 0) { for (const t of unk) if (mark(t, "safe", "count", info, [])) changed = true; }
        else if (unk.length && rem === unk.length) { for (const t of unk) if (mark(t, "mine", "count", info, [])) changed = true; }
      }
    }
  };

  // lists every way to place mines on one linked group of tiles; capped so a huge open group cannot freeze the page
  const NODE_CAP = 250000;
  const solveGroup = (tiles, gcons) => {
    const adj = new Map(tiles.map(t => [t, []]));
    gcons.forEach((k, i) => { for (const t of k.S) adj.get(t).push(i); });
    const order = [], pos = new Set([tiles[0]]), queue = [tiles[0]];
    for (let q = 0; q < queue.length; q++) {
      const t = queue[q];
      order.push(t);
      for (const i of adj.get(t)) for (const u of gcons[i].S) if (!pos.has(u)) { pos.add(u); queue.push(u); }
    }
    const n = order.length, need = gcons.map(k => k.need), cm = gcons.map(() => 0), cr = gcons.map(k => k.S.size);
    const cl = order.map(t => adj.get(t));
    const assign = new Uint8Array(n), feasible = new Map();
    let nodes = 0, aborted = false;
    const rec = (p, k) => {
      if (aborted) return;
      if (++nodes > NODE_CAP) { aborted = true; return; }
      if (p === n) {
        let f = feasible.get(k);
        if (!f) { f = { mine: new Uint8Array(n), safe: new Uint8Array(n), count: 0, mc: new Float64Array(n) }; feasible.set(k, f); }
        f.count++;
        for (let i = 0; i < n; i++) { if (assign[i]) { f.mine[i] = 1; f.mc[i]++; } else f.safe[i] = 1; }
        return;
      }
      for (let v = 0; v < 2; v++) {
        let ok = true;
        for (const c of cl[p]) { cm[c] += v; cr[c]--; }
        for (const c of cl[p]) if (cm[c] > need[c] || cm[c] + cr[c] < need[c]) { ok = false; break; }
        if (ok) { assign[p] = v; rec(p + 1, k + v); }
        for (const c of cl[p]) { cm[c] -= v; cr[c]++; }
      }
    };
    rec(0, 0);
    if (aborted) {
      capped = true;
      feasible.clear();
      for (let k = 0; k <= n; k++) feasible.set(k, { mine: new Uint8Array(n).fill(1), safe: new Uint8Array(n).fill(1) });
    }
    return { order, feasible };
  };

  const enumerate = () => {
    // quick clean-up first so big open groups shrink before listing; anything it finds is still a certainty of this rule
    relabel = "enumerate";
    simple({ full: true, satisfied: true, subset: true, overlap: true, count: true });
    relabel = null;
    const live = cons.filter(k => k.S.size);
    const parent = new Map();
    const find = t => { while (parent.get(t) !== t) { parent.set(t, parent.get(parent.get(t))); t = parent.get(t); } return t; };
    for (const k of live) for (const t of k.S) if (!parent.has(t)) parent.set(t, t);
    for (const k of live) { const first = find([...k.S][0]); for (const t of k.S) parent.set(find(t), first); }
    const groups = new Map();
    for (const t of parent.keys()) { const r = find(t); if (!groups.has(r)) groups.set(r, { tiles: [], cons: [] }); groups.get(r).tiles.push(t); }
    for (const k of live) groups.get(find([...k.S][0])).cons.push(k);
    let known = 0, unmarked = 0;
    for (const t of closed) { const m = marks.get(t); if (!m) unmarked++; else if (m.kind === "mine") known++; }
    const R = M - known, I = unmarked - parent.size;
    if (R < 0) return;
    const solved = [...groups.values()].map(g => solveGroup(g.tiles, g.cons));
    const zero = () => new Uint8Array(R + 1);
    const step = (from, ks) => { const out = zero(); for (let s = 0; s <= R; s++) if (from[s]) for (const k of ks) if (s + k <= R) out[s + k] = 1; return out; };
    const start = zero();
    start[0] = 1;
    const pre = [start];
    solved.forEach((g, i) => pre.push(step(pre[i], [...g.feasible.keys()])));
    const suf = new Array(solved.length + 1);
    suf[solved.length] = start;
    for (let i = solved.length - 1; i >= 0; i--) suf[i] = step(suf[i + 1], [...solved[i].feasible.keys()]);
    const all = pre[solved.length];
    // a group using k mines is possible if the rest of the board can supply a total that leaves 0..I mines for untouched tiles
    solved.forEach((g, gi) => {
      const others = zero();
      for (let a = 0; a <= R; a++) if (pre[gi][a]) for (let b = 0; a + b <= R; b++) if (suf[gi + 1][b]) others[a + b] = 1;
      const okK = new Map();
      for (const k of g.feasible.keys()) {
        let ok = false;
        for (let s = 0; s <= R && !ok; s++) if (others[s] && k + s <= R && R - (k + s) <= I) ok = true;
        okK.set(k, ok);
      }
      g.order.forEach((t, p) => {
        let canMine = false, canSafe = false;
        for (const [k, f] of g.feasible) if (okK.get(k)) { if (f.mine[p]) canMine = true; if (f.safe[p]) canSafe = true; }
        if (canMine && !canSafe) mark(t, "mine", "enumerate", {}, numsOf(t));
        else if (canSafe && !canMine) mark(t, "safe", "enumerate", {}, numsOf(t));
      });
    });
    if (I > 0) {
      let mineOk = false, safeOk = false;
      for (let s = 0; s <= R; s++) if (all[s]) { const ki = R - s; if (ki <= I) { if (ki >= 1) mineOk = true; if (ki <= I - 1) safeOk = true; } }
      for (const t of closed) if (!marks.has(t) && !parent.has(t)) {
        if (mineOk && !safeOk) mark(t, "mine", "enumerate", {}, []);
        else if (safeOk && !mineOk) mark(t, "safe", "enumerate", {}, []);
      }
    }
    if (on.chance && !capped) {
      const binom = new Float64Array(R + 1);
      binom[0] = 1;
      for (let m = 0; m < R; m++) binom[m + 1] = m + 1 > I ? 0 : binom[m] * (I - m) / (m + 1);
      const poly = g => { const a = new Float64Array(R + 1); for (const [k, f] of g.feasible) if (k <= R) a[k] = f.count; return a; };
      const conv = (a, b) => {
        const out = new Float64Array(R + 1);
        for (let i = 0; i <= R; i++) if (a[i]) for (let j = 0; i + j <= R; j++) if (b[j]) out[i + j] += a[i] * b[j];
        return out;
      };
      const one = new Float64Array(R + 1);
      one[0] = 1;
      const Pf = [one];
      solved.forEach((g, i) => Pf.push(conv(Pf[i], poly(g))));
      const Qf = new Array(solved.length + 1);
      Qf[solved.length] = one;
      for (let i = solved.length - 1; i >= 0; i--) Qf[i] = conv(Qf[i + 1], poly(solved[i]));
      const full = Pf[solved.length];
      let total = 0;
      for (let s = 0; s <= R; s++) total += full[s] * binom[R - s];
      if (total > 0 && isFinite(total)) {
        probs = new Map();
        solved.forEach((g, gi) => {
          const D = conv(Pf[gi], Qf[gi + 1]), Wk = new Map();
          for (const k of g.feasible.keys()) { let w = 0; for (let s = 0; s + k <= R; s++) w += D[s] * binom[R - k - s]; Wk.set(k, w); }
          g.order.forEach((t, p) => {
            let num = 0;
            for (const [k, f] of g.feasible) num += f.mc[p] * Wk.get(k);
            probs.set(t, Math.min(1, num / total));
          });
        });
        // tiles with no number next to them only get a chance once a single mine is left to place
        if (I > 0 && R <= 1) {
          let ex = 0;
          for (let s = 0; s <= R; s++) ex += full[s] * binom[R - s] * (R - s);
          const pi = Math.min(1, ex / (I * total));
          for (const t of closed) if (!marks.has(t) && !parent.has(t)) probs.set(t, pi);
        }
      } else capped = true;
    }
  };

  simple(on);
  if (on.enumerate) enumerate();
  return { marks, capped, probs };
}

function buildCons() {
  const cons = [], closed = [];
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const c = grid[y][x];
    if (!c.open) { closed.push(y * W + x); continue; }
    if (!c.n) continue;
    const S = new Set();
    for (const [a, b] of neighbors(x, y)) if (!grid[b][a].open) S.add(b * W + a);
    if (S.size) cons.push({ S, S0: new Set(S), need: c.n, n: c.n, src: y * W + x });
  }
  return { cons, closed };
}

function solve() {
  const a = buildCons(), res = infer(a.cons, a.closed, M, { ...rules, chance: false });
  res.probs = new Map();
  if (rules.chance) {
    // chances come from every layout, whichever rules are switched on
    const b = buildCons(), r2 = infer(b.cons, b.closed, M, { full: true, satisfied: true, subset: true, overlap: true, count: true, enumerate: true, chance: true });
    if (r2.probs) {
      for (const [t, m] of r2.marks) r2.probs.set(t, m.kind === "mine" ? 1 : 0);
      res.probs = r2.probs;
    } else res.capped = true;
    if (r2.capped) res.capped = true;
  }
  return res;
}

function refreshMarks() {
  const next = !over && started && Object.values(rules).some(Boolean) ? solve() : { marks: new Map(), capped: false, probs: new Map() };
  const old = marks, oldP = chances;
  marks = next.marks;
  chances = next.probs;
  capped = next.capped;
  $("capnote").hidden = !capped;
  if (over) return;
  for (const k of new Set([...old.keys(), ...marks.keys(), ...oldP.keys(), ...chances.keys()])) {
    const a = old.get(k), b = marks.get(k), pa = oldP.get(k), pb = chances.get(k);
    if (!a !== !b || (a && a.kind !== b.kind) || pa !== pb) paint(k % W, Math.floor(k / W));
  }
  showWhy(whyTile);
  autoRun();
}

// One automatic move at a time: flag a red mine, open a safe tile, or clear around a finished number.
function autoStep() {
  if (over || autoBusy) return false;
  autoBusy = true;
  try {
    if (autoFlag) for (const [k, m] of marks) {
      const x = k % W, y = Math.floor(k / W), c = grid[y][x];
      if (m.kind === "mine" && !c.open && !c.flag) { flag(x, y); return true; }
    }
    if (autoOpen) for (const [k, m] of marks) {
      const x = k % W, y = Math.floor(k / W), c = grid[y][x];
      if (m.kind === "safe" && !c.open && !c.flag) { dig(x, y); return true; }
    }
    if (autoAll) for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const c = grid[y][x];
      if (!c.open || !c.n) continue;
      let f = 0, closed = 0;
      for (const [a, b] of neighbors(x, y)) { const t = grid[b][a]; if (t.flag) f++; else if (!t.open) closed++; }
      if (f === c.n && closed) { chord(x, y); return true; }
    }
    return false;
  } finally { autoBusy = false; }
}

// runs the moves back to back, or one every autoDelay ms so they can be watched
function autoRun() {
  if (autoBusy || autoTimer || over || !(autoFlag || autoOpen || autoAll)) return;
  if (autoDelay === 0) { for (let n = 0; n < 5000 && autoStep(); n++); return; }
  const tick = () => { autoTimer = null; if (autoStep()) autoTimer = setTimeout(tick, autoDelay); };
  tick();
}

// ---- the rules panel ----
const mg = (cols, str) => `<div class="mg" style="--cols:${cols}">` + str.split(" ").map(tk => {
  if (tk === "_") return '<i class="mt gap"></i>';
  if (tk === "#") return '<i class="mt"></i>';
  if (tk === ".") return '<i class="mt o"></i>';
  if (tk === "M") return '<i class="mt m"></i>';
  if (tk === "S") return '<i class="mt s"></i>';
  if (tk[0] === "%") return `<i class="mt p">${tk.slice(1)}%</i>`;
  return `<i class="mt o n${tk}">${tk}</i>`;
}).join("") + "</div>";

const RULES = [
  { id: "full", name: "Full count",
    how: "If a number's closed tiles equal the number, they are all mines.",
    ex: mg(3, ". . . . 2 M . M .") },
  { id: "satisfied", name: "Satisfied",
    how: "If a number already has its mines, its other closed tiles are safe.",
    ex: mg(3, ". . . M 1 S . . .") },
  { id: "subset", name: "Subset",
    how: "One number's tiles sit inside another's. The leftover tiles hold the difference: all mines, or none if it is zero. Here the 1 sits inside the 2, so the last tile is a mine.",
    ex: mg(3, "1 2 _ # # M") },
  { id: "overlap", name: "Overlap",
    how: "Two numbers share tiles. If one needs as many more mines as it has tiles of its own, those are all mines and the other's own tiles are safe. Here 3 in 4 tiles and 1 in 3 forces the first two.",
    ex: '<div class="mg" style="--cols:5"><i class="mt m"></i><i class="mt m"></i><i class="mt"></i><i class="mt"></i><i class="mt s"></i><div class="eb a" style="grid-column:1/5">3 mines</div><div class="eb b" style="grid-column:3/6">1 mine</div></div>' },
  { id: "count", name: "Mine count",
    how: "If the mines left equal the unknown tiles, they are all mines. If none are left, they are all safe.",
    ex: mg(2, "M M") + '<div class="chip">2 mines left, 2 tiles</div>' },
  { id: "enumerate", name: "Every layout",
    how: "List every layout that fits the numbers and the total. A tile that is always a mine is certain. One that is never a mine is safe. This catches everything above.",
    ex: '<div class="mg" style="--cols:4"><i class="mt m">a</i><i class="mt s">b</i><i class="mt s">c</i><i class="mt m">d</i></div><div class="chip">2 in a, b, d</div> <div class="chip">1 in a, c</div> <div class="chip">1 in c, d</div><p>If c were a mine, a and d could not be, and the 2 would get just 1. So c is safe.</p>' },
  { id: "chance", name: "Chances",
    how: "Tiles next to a number show their chance of being a mine, from the numbers and the mine total. Safe tiles show 0%. Guess the lowest one.",
    ex: mg(3, "1 %50 %50") + '<div class="chip">The 1 splits its mine two ways</div>' },
];

const ruleEls = {};

function syncRules() {
  for (const r of RULES) ruleEls[r.id].classList.toggle("on", rules[r.id]);
  $("allrules").classList.toggle("on", RULES.every(r => rules[r.id]));
}

function saveRules() {
  try { localStorage.setItem("mfRules2", JSON.stringify(rules)); } catch (err) {}
  syncRules();
  refreshMarks();
}

function buildRules() {
  const list = $("rulelist");
  list.innerHTML = "";
  RULES.forEach((r, i) => {
    const el = document.createElement("div");
    el.className = "rule";
    el.innerHTML = `<button class="rbox"><b>${i + 1}</b><span>${r.name}</span></button><button class="how">How it works</button>
      <div class="lesson" hidden><p>${r.how}</p>${r.ex}</div>`;
    el.querySelector(".how").onclick = () => { const l = el.querySelector(".lesson"); l.hidden = !l.hidden; };
    el.querySelector(".rbox").onclick = () => { rules[r.id] = !rules[r.id]; saveRules(); };
    ruleEls[r.id] = el;
    list.appendChild(el);
  });
  $("allrules").onclick = () => {
    const on = !RULES.every(r => rules[r.id]);
    for (const r of RULES) rules[r.id] = on;
    saveRules();
  };
  syncRules();
}

function setDrawer(open) { $("rules").classList.toggle("open", open); }

function pctText(p) {
  if (p < 1e-9) return "0%";
  if (p > 1 - 1e-9) return "100%";
  const r = Math.round(p * 100);
  return r === 0 ? "<1%" : r === 100 ? ">99%" : r + "%";
}

const pl = (n, w) => n + " " + w + (n === 1 ? "" : "s");
function whyText(mk) {
  const i = mk.info, mine = mk.kind === "mine";
  switch (mk.rule) {
    case "full": return `This ${i.n} needs ${i.need} more and has ${pl(i.size, "closed tile")}: all mines.`;
    case "satisfied": return `This ${i.n} has all its mines, so the rest are safe.`;
    case "subset": return `The ${i.a.n} sits inside the ${i.b.n}. The other ${pl(i.size, "tile")} ${i.size === 1 ? "has" : "have"} ${i.dn}: ` + (mine ? "all mines." : "safe.");
    case "overlap": return `The ${i.a.n} needs ${i.size} more than the ${i.b.n} and has ${pl(i.size, "tile")} only it touches: ` + (mine ? "all mines." : "so the other's own tiles are safe.");
    case "count": return mine ? `${pl(i.rem, "mine")} left, ${pl(i.unknown, "unknown tile")}: all mines.` : "No mines left, so these are safe.";
    default: return mine ? "A mine in every layout that fits." : "Never a mine in any layout that fits.";
  }
}

function showWhy(t) {
  whyTile = t;
  const mk = t && !over ? marks.get(t[1] * W + t[0]) : null;
  const old = whySet;
  whySet = new Set(mk ? mk.nums : []);
  if (!over) for (const k of new Set([...old, ...whySet])) if (old.has(k) !== whySet.has(k)) paint(k % W, Math.floor(k / W));
  const r = mk && RULES.find(x => x.id === mk.rule);
  $("why").innerHTML = mk ? `<b>${mk.kind === "mine" ? "Mine" : "Safe"} · ${r.name}</b><br>${whyText(mk)}` : "";
}

// opens tiles breadth first; each tile's delay grows with its distance so the clear ripples outward
function reveal(x, y) {
  const q = [[x, y, 0]], now = performance.now();
  for (let i = 0; i < q.length; i++) {
    const [cx, cy, d] = q[i], c = grid[cy][cx];
    if (c.open || c.flag) continue;
    c.open = true; revealed++;
    c.d = Math.min(d * 35, 800); c.t0 = now;
    paint(cx, cy);
    if (!c.n) for (const [nx, ny] of neighbors(cx, cy)) q.push([nx, ny, d + 1]);
  }
  noteAssist();
  refreshMarks();
}

function dig(x, y) {
  if (over) return;
  lastTile = [x, y];
  const c = grid[y][x];
  if (c.flag) return;
  if (c.open) return chord(x, y);
  if (!started) plant(x, y);
  if (c.mine) return lose(x, y);
  reveal(x, y);
  if (revealed === W * H - M) win();
}

function chord(x, y) {
  lastTile = [x, y];
  const c = grid[y][x];
  const ns = neighbors(x, y);
  if (!c.n || ns.filter(([a, b]) => grid[b][a].flag).length !== c.n) return;
  for (const [a, b] of ns) {
    const t = grid[b][a];
    if (t.flag || t.open) continue;
    if (t.mine) return lose(a, b);
    reveal(a, b);
  }
  if (revealed === W * H - M) win();
}

function flag(x, y) {
  if (over) return;
  const c = grid[y][x];
  if (c.open) return;
  c.flag = !c.flag;
  flags += c.flag ? 1 : -1;
  $("mines").textContent = pad(M - flags);
  paint(x, y);
  if (experimental) for (const [a, b] of neighbors(x, y)) if (grid[b][a].open) paint(a, b);
}

function lose(bx, by) {
  over = true; endHover(); clearInterval(timer);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const c = grid[y][x], el = cells[y][x];
    if (c.mine && !c.flag) { el.className = "c open mine"; el.style.setProperty("--md", Math.min(Math.hypot(x - bx, y - by) * 45, 900) + "ms"); }
    else if (!c.mine && c.flag) el.className = "c open wrong";
  }
  cells[by][bx].className = "c open mine boom";
  $("msg").textContent = "Boom. Game over"; $("msg").className = "lose";
  recordGame(false);
  if (!calm()) {
    const sc = document.querySelector(".scroller");
    sc.classList.remove("shake");
    void sc.offsetWidth;
    sc.classList.add("shake");
  }
}

function win() {
  over = true; endHover(); clearInterval(timer);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const c = grid[y][x];
    if (c.mine && !c.flag) { c.flag = true; paint(x, y); }
    if (c.mine) cells[y][x].classList.add("win");
  }
  if (experimental) for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (grid[y][x].open) paint(x, y);
  $("mines").textContent = "000";
  const isBest = bests[mode] == null || secs < bests[mode];
  if (isBest) {
    bests[mode] = secs;
    try { localStorage.setItem("mfBest", JSON.stringify(bests)); } catch (err) {}
    showBest();
  }
  $("msg").textContent = `Cleared in ${secs}s` + (isBest ? " · best" : ""); $("msg").className = "win";
  recordGame(true);
  if (!calm()) {
    // a gold wave runs out from the last tile you cleared
    const [ox, oy] = lastTile || [W >> 1, H >> 1];
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++)
      cells[y][x].style.animation = `wave .7s ease-out ${Math.min(Math.hypot(x - ox, y - oy) * 30, 1000)}ms both`;
  }
}

const calm = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

function setHl(pos) {
  const old = hl;
  hl = pos;
  if (over) return;
  for (const p of [old, pos]) {
    if (!p) continue;
    for (let y = p[1] - 1; y <= p[1] + 1; y++) for (let x = p[0] - 1; x <= p[0] + 1; x++)
      if (x >= 0 && y >= 0 && x < W && y < H) paint(x, y);
  }
}

// the tiles around a tile light up while the middle button is held, or while hovering with hover chord on
function refreshHl() {
  const want = midHeld ? midPos : (autoChord ? hover : null);
  if (want === hl || (want && hl && want[0] === hl[0] && want[1] === hl[1])) return;
  setHl(want);
}

function setHover(pos) { hover = pos; refreshHl(); }

function endHover() {
  hover = hl = null; midHeld = false;
  boardEl.querySelectorAll(".adj").forEach(el => el.classList.remove("adj"));
}

function emptyStats() {
  const o = { streak: 0, bestStreak: 0, assisted: 0 };
  for (const m of Object.keys(MODES)) o[m] = { p: 0, w: 0, total: 0 };
  return o;
}

function noteAssist() {
  if (autoFlag || autoOpen || autoAll || autoChord || Object.values(rules).some(Boolean)) assisted = true;
}

function recordGame(won) {
  const st = stats[mode];
  st.p++;
  if (won) {
    st.w++; st.total += secs; stats.streak++;
    stats.bestStreak = Math.max(stats.bestStreak, stats.streak);
    if (assisted) stats.assisted++;
  } else stats.streak = 0;
  try { localStorage.setItem("mfStats", JSON.stringify(stats)); } catch (err) {}
}

function renderStats() {
  const rows = Object.keys(MODES).map(m => {
    const t = stats[m];
    return `<tr><td>${m}</td><td>${t.w}/${t.p}</td><td>${t.p ? Math.round(100 * t.w / t.p) + "%" : "-"}</td><td>${bests[m] == null ? "-" : bests[m] + "s"}</td><td>${t.w ? Math.round(t.total / t.w) + "s" : "-"}</td></tr>`;
  }).join("");
  $("statsbody").innerHTML = `<table><tr><th></th><th>Won</th><th>Rate</th><th>Best</th><th>Avg</th></tr>${rows}</table>
    <div class="srow"><span>Win streak</span><b>${stats.streak} (best ${stats.bestStreak})</b></div>
    <div class="srow"><span>Assisted wins</span><b>${stats.assisted}</b></div>`;
}

function showBest() { $("best").textContent = bests[mode] == null ? "---" : pad(bests[mode]); }

function settle() { autoRun(); hoverChord(); }

function hoverChord() {
  if (!autoChord || over || !hover || !grid[hover[1]][hover[0]].open) return;
  chord(...hover);
}

// input: left click, right click, long press for touch
let pressTimer = null, longFired = false;
function target(e) { const t = e.target.closest(".c"); return t ? [+t.dataset.x, +t.dataset.y] : null; }

boardEl.addEventListener("contextmenu", e => {
  e.preventDefault();
  const t = target(e); if (t) { flag(...t); settle(); }
});
boardEl.addEventListener("pointerover", e => {
  if (e.pointerType !== "mouse") return;
  const t = target(e);
  if (t) { if (midHeld) midPos = t; setHover(t); showWhy(t); settle(); }
});
boardEl.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") { setHover(null); showWhy(null); } });
boardEl.addEventListener("mousedown", e => {
  if (e.button !== 1) return;
  e.preventDefault();
  const t = target(e);
  if (t) { midHeld = true; midPos = t; refreshHl(); }
});
window.addEventListener("mouseup", e => { if (e.button === 1) { midHeld = false; refreshHl(); } });
boardEl.addEventListener("auxclick", e => {
  if (e.button !== 1) return;
  e.preventDefault();
  const t = target(e);
  if (t && !over && grid[t[1]][t[0]].open) { chord(...t); settle(); }
});
boardEl.addEventListener("pointerdown", e => {
  if (e.pointerType === "mouse") return;
  const t = target(e); if (!t) return;
  longFired = false;
  pressTimer = setTimeout(() => { longFired = true; flag(...t); settle(); if (navigator.vibrate) navigator.vibrate(20); }, 380);
});
["pointerup", "pointercancel", "pointermove"].forEach(ev =>
  boardEl.addEventListener(ev, () => clearTimeout(pressTimer)));
boardEl.addEventListener("click", e => {
  if (longFired) { longFired = false; return; }
  const t = target(e);
  if (t) { if (tapFlag && !grid[t[1]][t[0]].open) flag(...t); else dig(...t); settle(); }
});
document.querySelectorAll("#tapmode button").forEach(b => b.onclick = () => {
  tapFlag = b.dataset.m === "flag";
  document.querySelectorAll("#tapmode button").forEach(o => o.classList.toggle("on", o === b));
});
$("face").onclick = reset;
stats = emptyStats();
try { const saved = JSON.parse(localStorage.getItem("mfStats")); if (saved) stats = Object.assign(emptyStats(), saved); } catch (e) {}
$("statsbtn").onclick = () => { renderStats(); $("statsmodal").hidden = false; };
$("statsclose").onclick = () => { $("statsmodal").hidden = true; };
$("statsmodal").onclick = e => { if (e.target === $("statsmodal")) $("statsmodal").hidden = true; };
$("statsreset").onclick = () => {
  const b = $("statsreset");
  if (b.textContent === "Reset") { b.textContent = "Sure?"; setTimeout(() => { b.textContent = "Reset"; }, 3000); return; }
  b.textContent = "Reset";
  stats = emptyStats();
  bests = {};
  try { localStorage.setItem("mfStats", JSON.stringify(stats)); localStorage.setItem("mfBest", "{}"); } catch (err) {}
  showBest();
  renderStats();
};
document.addEventListener("click", e => { if (!e.target.closest("#rules")) setDrawer(false); });
document.addEventListener("keydown", e => { if (e.key === "Escape") { setDrawer(false); $("statsmodal").hidden = true; } });
try { bests = JSON.parse(localStorage.getItem("mfBest")) || {}; } catch (e) {}
try { autoChord = localStorage.getItem("autochord") === "1"; } catch (e) {}
$("autochord").classList.toggle("on", autoChord);
$("rtab").onclick = () => setDrawer(!$("rules").classList.contains("open"));
$("autochord").onclick = () => {
  autoChord = !autoChord;
  $("autochord").classList.toggle("on", autoChord);
  try { localStorage.setItem("autochord", autoChord ? "1" : "0"); } catch (err) {}
  refreshHl();
  settle();
};
try { autoAll = localStorage.getItem("autosweep") === "1"; } catch (e) {}
$("autosweep").classList.toggle("on", autoAll);
$("autosweep").onclick = () => {
  autoAll = !autoAll;
  $("autosweep").classList.toggle("on", autoAll);
  try { localStorage.setItem("autosweep", autoAll ? "1" : "0"); } catch (err) {}
  settle();
};
try { autoFlag = localStorage.getItem("autoflag") === "1"; autoOpen = localStorage.getItem("autoopen") === "1"; } catch (e) {}
$("autoflag").classList.toggle("on", autoFlag);
$("autoopen").classList.toggle("on", autoOpen);
$("autoflag").onclick = () => {
  autoFlag = !autoFlag;
  $("autoflag").classList.toggle("on", autoFlag);
  try { localStorage.setItem("autoflag", autoFlag ? "1" : "0"); } catch (err) {}
  autoRun();
};
// slider position 0 is no delay, then 10 ms rising steeply to 1 s at the far right
const DELAY_STEPS = 20;
const delayMs = v => v === 0 ? 0 : Math.round(10 * Math.pow(100, (v - 1) / (DELAY_STEPS - 1)));
const showDelay = () => { $("delayval").textContent = autoDelay >= 1000 ? "1 s" : autoDelay + " ms"; };
let delayPos = 0;
try { delayPos = Math.min(DELAY_STEPS, Math.max(0, parseInt(localStorage.getItem("autodelay2"), 10) || 0)); } catch (e) {}
autoDelay = delayMs(delayPos);
$("autodelay").value = delayPos;
showDelay();
$("autodelay").oninput = e => {
  delayPos = +e.target.value;
  autoDelay = delayMs(delayPos);
  showDelay();
  try { localStorage.setItem("autodelay2", String(delayPos)); } catch (err) {}
};
$("autoopen").onclick = () => {
  autoOpen = !autoOpen;
  $("autoopen").classList.toggle("on", autoOpen);
  try { localStorage.setItem("autoopen", autoOpen ? "1" : "0"); } catch (err) {}
  autoRun();
};
document.addEventListener("keydown", e => { if (e.key === "r" || e.key === "R") reset(); });

buildTabs();
buildModes();
buildRules();
reset();
</script>
</body>
</html>
