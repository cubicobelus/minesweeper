<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Minesweeper</title>
<style>
  :root {
    --bg: #060607;
    --surface: #111112;
    --cell: #2b2b2f;
    --cell-hi: #3a3a3f;
    --cell-hover: #46464c;
    --open: #000;
    --line: #26262a;
    --text: #f5f5f2;
    --dim: #8a8a86;
    --accent: #d4af37;
    --red: #c23b32;
    --num: ui-monospace, "Cascadia Mono", Consolas, "SF Mono", monospace;
    --size: 36px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { scrollbar-gutter: stable; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Inter", "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 40px 12px 120px;
    user-select: none; -webkit-user-select: none;
  }
  .wrap { position: relative; display: flex; flex-direction: column; align-items: stretch; max-width: 100%; }
  h1 { text-align: center; margin: 0 0 20px; font-size: 1.05rem; font-weight: 600; letter-spacing: -.01em; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 14px; flex-wrap: wrap; }
  .tabs { display: flex; justify-content: center; gap: 22px; margin-bottom: 18px; border-bottom: 1px solid var(--line); }
  .tabs button { font: inherit; font-size: .85rem; font-weight: 500; color: var(--dim); background: none; border: 0; padding: 0 0 10px; margin-bottom: -1px; cursor: pointer; border-bottom: 2px solid transparent; transition: color .15s; }
  .tabs button:hover { color: var(--text); }
  .tabs button.on { color: var(--text); border-bottom-color: var(--accent); }
  .modes { display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
  .modes button {
    font: inherit; font-size: .8rem; font-weight: 500; color: var(--dim); background: none;
    border: 0; border-radius: 7px; padding: 6px 14px; cursor: pointer; transition: color .15s, background .15s;
  }
  .modes button:hover { color: var(--text); }
  .modes button.on { color: var(--text); background: var(--cell-hi); }
  .stats { display: flex; align-items: center; gap: 18px; font-size: .85rem; color: var(--dim); font-variant-numeric: tabular-nums; }
  .stats b { color: var(--text); font-weight: 600; margin-left: 6px; }
  #face {
    font: inherit; font-size: .8rem; font-weight: 500; color: var(--bg); background: var(--text);
    border: 0; border-radius: 8px; padding: 6px 14px; cursor: pointer; transition: opacity .15s;
  }
  #face:hover { opacity: .85; }
  .scroller { align-self: center; width: fit-content; max-width: 100%; overflow: auto; padding: 10px; border-radius: 16px; background: #000; border: 1px solid rgba(255,255,255,.08); }
  #board { display: grid; gap: 3px; touch-action: manipulation; }
  .c {
    position: relative; width: var(--size); height: var(--size); border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--num); font-weight: 700; font-size: calc(var(--size) * .5); font-variant-numeric: tabular-nums;
    background: linear-gradient(160deg, var(--cell-hi), var(--cell)); box-shadow: inset 0 1px 0 rgba(255,255,255,.1), inset 0 -2px 0 rgba(0,0,0,.3); cursor: pointer; transition: background .12s, box-shadow .12s;
  }
  .c:hover:not(.open) { background: linear-gradient(160deg, var(--cell-hover), var(--cell-hi)); box-shadow: inset 0 0 0 1px rgba(212,175,55,.6); }
  .c.open { background: var(--open); box-shadow: none; cursor: default; }
  .c.adj:not(.open) { background: #4a4224; box-shadow: inset 0 0 0 1px rgba(212,175,55,.45); }
  .c.adj.open { background: #17140a; }
  .settings { position: relative; align-self: center; margin-top: 14px; }
  #gear { font: inherit; font-size: .78rem; color: var(--dim); background: none; border: 0; padding: 0; cursor: pointer; }
  #gear:hover { color: var(--text); }
  #panel { position: absolute; top: calc(100% + 8px); left: 50%; transform: translateX(-50%); width: min(320px, 86vw); z-index: 5; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; box-shadow: 0 12px 32px rgba(0,0,0,.6); }
  .c.flag, .c.flag:hover, .c.flag.adj { background: #000; box-shadow: inset 0 0 0 1px rgba(255,255,255,.07); }
  .c.flag.adj { box-shadow: inset 0 0 0 1px rgba(212,175,55,.45); }
  .c.flag::before {
    content: ""; width: 0; height: 0; margin-left: 3px;
    border-left: 11px solid var(--accent); border-top: 6px solid transparent; border-bottom: 6px solid transparent;
  }
  .c.flag::after { content: ""; position: absolute; width: 2px; height: 16px; background: var(--accent); left: calc(50% - 7px); top: calc(50% - 8px); border-radius: 1px; }
  .c.anim { animation: clear .28s ease-out backwards; }
  @keyframes clear {
    from { background: var(--cell); color: transparent; box-shadow: inset 0 1px 0 rgba(255,255,255,.08); transform: scale(1); }
    40% { background: var(--cell); transform: scale(.8); }
    to { transform: scale(1); }
  }
  @keyframes dot { from { transform: scale(0); } 70% { transform: scale(1.25); } to { transform: scale(1); } }
  .c.flag::before, .c.flag::after { animation: dot .18s ease-out; }
  .c.sure, .c.sure:hover:not(.open), .c.sure.adj:not(.open) { background: #8c2f2a; box-shadow: inset 0 1px 0 rgba(255,255,255,.12), inset 0 -2px 0 rgba(0,0,0,.2); }
  .c.sure:hover:not(.open) { background: #a33a33; }
  .c.sure.adj:not(.open) { box-shadow: inset 0 0 0 1px rgba(212,175,55,.45); }
  .c.safe, .c.safe:hover:not(.open), .c.safe.adj:not(.open) { background: #c9a227; box-shadow: inset 0 1px 0 rgba(255,255,255,.18), inset 0 -2px 0 rgba(0,0,0,.2); }
  .c.safe:hover:not(.open) { background: #dcb73c; }
  .c.safe.adj:not(.open) { box-shadow: inset 0 0 0 1px rgba(212,175,55,.45); }
  .c.safe::before { content: ""; width: 8px; height: 15px; border: solid rgba(24,16,0,.8); border-width: 0 3px 3px 0; transform: rotate(45deg) translate(-2px, -2px); }
  .c.why { box-shadow: inset 0 0 0 2px var(--accent); }
  .box, .rule { border: 1px solid var(--line); border-radius: 12px; background: #101011; color: var(--dim); transition: border-color .15s, background .15s, color .15s; }
  .box { display: block; width: 100%; text-align: left; font: inherit; font-size: .82rem; padding: 10px 12px; cursor: pointer; }
  .box small { display: block; margin-top: 2px; font-size: .7rem; color: var(--dim); }
  .box.on, .rule.on { border-color: rgba(212,175,55,.7); background: rgba(212,175,55,.09); color: var(--text); }
  #panel .box { min-width: 200px; }
  #rules { position: fixed; z-index: 20; left: 0; top: 0; bottom: 0; width: min(330px, 88vw); background: #09090a; border-right: 1px solid var(--line); transform: translateX(-100%); transition: transform .25s ease; }
  #rules.open { transform: none; box-shadow: 12px 0 40px rgba(0,0,0,.6); }
  #rtab { position: absolute; left: 100%; top: 110px; writing-mode: vertical-rl; padding: 16px 8px; font: inherit; font-size: .72rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); background: #09090a; border: 1px solid var(--line); border-left: 0; border-radius: 0 10px 10px 0; cursor: pointer; }
  #rtab:hover { color: #000; background: var(--accent); }
  .rin { height: 100%; overflow: auto; padding: 18px 14px 40px; }
  .lead { margin: 0 0 12px; color: var(--dim); font-size: .74rem; }
  .rule { margin-bottom: 8px; }
  .rbox { display: flex; align-items: center; gap: 10px; width: 100%; padding: 11px 12px; background: none; border: 0; color: inherit; font: inherit; font-size: .85rem; text-align: left; cursor: pointer; }
  .rbox b { flex: none; display: grid; place-items: center; width: 20px; height: 20px; border-radius: 6px; background: #232326; color: var(--dim); font-size: .72rem; }
  .rule.on .rbox b { background: var(--accent); color: #000; }
  .rbox em { margin-left: auto; font-style: normal; font-size: .6rem; text-transform: uppercase; letter-spacing: .08em; opacity: .7; }
  .rule details { padding: 0 12px 10px 42px; }
  .rule summary { cursor: pointer; font-size: .74rem; color: var(--dim); }
  .rule summary:hover { color: var(--text); }
  .lesson { color: var(--dim); font-size: .76rem; line-height: 1.5; }
  .lesson p { margin: 8px 0; }
  .mg { display: grid; grid-template-columns: repeat(var(--cols), 24px); gap: 3px; margin: 8px 0 2px; }
  .mt { width: 24px; height: 24px; border-radius: 6px; background: var(--cell); display: flex; align-items: center; justify-content: center; font: 700 .78rem var(--num); font-style: normal; }
  .mt.o { background: #000; }
  .mt.m { background: #8c2f2a; color: #fff; }
  .mt.s { background: #c9a227; color: #181000; }
  .mt.gap { visibility: hidden; }
  .eb { height: 16px; border-radius: 8px; font-size: .62rem; line-height: 16px; text-align: center; color: #000; font-weight: 600; }
  .eb.a { background: var(--accent); }
  .eb.b { background: #9a9a95; }
  .chip { display: inline-block; margin-top: 6px; padding: 3px 8px; border-radius: 8px; background: #000; color: var(--text); font-size: .7rem; }
  #capnote { margin-top: 10px; color: var(--accent); font-size: .72rem; }
  #why { width: 0; min-width: 100%; min-height: 2.9em; margin-top: 8px; text-align: center; color: var(--dim); font-size: .78rem; line-height: 1.45; }
  #why b { color: var(--text); font-weight: 600; }
  .c.mine::before { animation: dot .3s ease-out backwards; animation-delay: var(--md, 0ms); }
  @media (prefers-reduced-motion: reduce) { .c.anim, .c.flag::before, .c.flag::after, .c.mine::before { animation: none; } }
  .c.mine::before { content: ""; width: 38%; height: 38%; border-radius: 50%; background: var(--red); }
  .c.boom { background: rgba(194,59,50,.3); }
  .c.wrong::before { content: ""; width: 38%; height: 2px; background: var(--red); transform: rotate(-45deg); }
  .c.wrong::after { content: ""; position: absolute; width: 38%; height: 2px; background: var(--red); transform: rotate(45deg); }
  .c.wrong { background: rgba(194,59,50,.12); }
  .c.win.flag::before { border-left-color: #f0d36a; }
  .c.win.flag::after { background: #f0d36a; }
  .n1 { color: #6ea8ff; } .n2 { color: #5fd39a; } .n3 { color: #ff7a7a; } .n4 { color: #b394ff; }
  .n0 { color: #3a3a36; } .neg { color: var(--red); }
  .n5 { color: #ffb86b; } .n6 { color: #5fd3d3; } .n7 { color: #e5e5ea; } .n8 { color: #8a8a96; }
  #msg { text-align: center; height: 1.4em; margin-top: 14px; font-size: .85rem; font-weight: 500; color: var(--dim); }
  #msg.win { color: var(--accent); }
  #msg.lose { color: var(--red); }
  .hint { width: 0; min-width: 100%; text-align: center; margin-top: 4px; color: var(--dim); font-size: .75rem; opacity: .7; }
  @media (max-width: 520px) { :root { --size: 30px; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>minesweeper</h1>
  <div class="tabs" id="tabs"></div>
  <div class="top">
    <div class="modes" id="modes"></div>
    <div class="stats">
      <span>Mines<b id="mines">010</b></span>
      <span>Time<b id="time">000</b></span>
      <button id="face">New game</button>
    </div>
  </div>
  <div class="scroller"><div id="board"></div></div>
  <div id="msg"></div>
  <div id="why" hidden></div>
  <div class="settings">
    <button id="gear">Settings</button>
    <div id="panel" hidden>
      <button class="box" id="autochord"><b>Hover chord</b><small>Hovering works like a middle-click</small></button>
    </div>
  </div>
  <div class="hint" id="exp" hidden></div>
  <div class="hint">Click dig · Right-click flag · Middle-click clear · R restart</div>
</div>
<aside id="rules" hidden>
  <button id="rtab">Rules</button>
  <div class="rin">
    <p class="lead">Click a rule to turn it on or off.</p>
    <div id="rulelist"></div>
    <div id="capnote" hidden>Rule 6 skipped some tangled areas.</div>
  </div>
</aside>

<script>
const MODES = {
  Easy:   { w: 9,  h: 9,  m: 10 },
  Medium: { w: 16, h: 16, m: 40 },
  Hard:   { w: 30, h: 16, m: 99 },
};
let view = "classic", marks = new Map(), capped = false, whySet = new Set(), whyTile = null, experimental = false, autoChord = false, hover = null, hl = null, midPos = null, midHeld = false, mode = "Easy", W, H, M, grid, cells, started, over, flags, revealed, timer, secs;

const $ = id => document.getElementById(id);
const boardEl = $("board");

function pad(n) { return String(Math.max(0, Math.min(999, n))).padStart(3, "0"); }

const VIEWS = [
  ["classic", "Classic", ""],
  ["experimental", "Experimental", "Flags subtract from nearby numbers."],
  ["finder", "Mine finder", "Red is a mine. Gold tick is safe."],
];

function buildTabs() {
  $("tabs").innerHTML = "";
  VIEWS.forEach(([id, name, hint]) => {
    const b = document.createElement("button");
    b.textContent = name;
    b.className = id === view ? "on" : "";
    b.onclick = () => {
      view = id; experimental = id === "experimental"; buildTabs();
      $("exp").hidden = !hint; $("exp").textContent = hint;
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (grid[y][x].open) paint(x, y);
      $("rules").hidden = id !== "finder";
      $("why").hidden = id !== "finder";
      if (id !== "finder") setDrawer(false);
      refreshMarks();
    };
    $("tabs").appendChild(b);
  });
}

function buildModes() {
  $("modes").innerHTML = "";
  for (const name in MODES) {
    const b = document.createElement("button");
    b.textContent = name;
    b.className = name === mode ? "on" : "";
    b.onclick = () => { mode = name; buildModes(); reset(); };
    $("modes").appendChild(b);
  }
}

function reset() {
  ({ w: W, h: H, m: M } = MODES[mode]);
  clearInterval(timer);
  hover = hl = midPos = null; midHeld = false; marks = new Map(); capped = false; whySet = new Set(); whyTile = null;
  secs = 0; started = false; over = false; flags = 0; revealed = 0;
  grid = Array.from({ length: H }, () => Array.from({ length: W }, () => ({ mine: false, n: 0, open: false, flag: false })));
  boardEl.style.gridTemplateColumns = `repeat(${W}, var(--size))`;
  boardEl.innerHTML = "";
  cells = [];
  for (let y = 0; y < H; y++) {
    cells.push([]);
    for (let x = 0; x < W; x++) {
      const el = document.createElement("div");
      el.className = "c";
      el.dataset.x = x; el.dataset.y = y;
      boardEl.appendChild(el);
      cells[y].push(el);
    }
  }
  $("time").textContent = "000";
  $("mines").textContent = pad(M);
  $("msg").textContent = ""; $("msg").className = "";
  showWhy(null);
}

function neighbors(x, y) {
  const out = [];
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
    if (!dx && !dy) continue;
    const nx = x + dx, ny = y + dy;
    if (nx >= 0 && ny >= 0 && nx < W && ny < H) out.push([nx, ny]);
  }
  return out;
}

function plant(sx, sy) {
  const safe = new Set([sx + "," + sy, ...neighbors(sx, sy).map(([a, b]) => a + "," + b)]);
  let placed = 0;
  while (placed < M) {
    const x = Math.floor(Math.random() * W), y = Math.floor(Math.random() * H);
    if (grid[y][x].mine || safe.has(x + "," + y)) continue;
    grid[y][x].mine = true; placed++;
  }
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++)
    grid[y][x].n = neighbors(x, y).filter(([a, b]) => grid[b][a].mine).length;
  timer = setInterval(() => { secs++; $("time").textContent = pad(secs); }, 1000);
  started = true;
}

function paint(x, y) {
  const c = grid[y][x], el = cells[y][x];
  el.className = "c";
  el.textContent = "";
  const mk = view === "finder" && !c.open && !c.flag ? marks.get(y * W + x) : null;
  if (mk) el.classList.add(mk.kind === "mine" ? "sure" : "safe");
  if (whySet.has(y * W + x)) el.classList.add("why");
  if (hl && Math.max(Math.abs(hl[0] - x), Math.abs(hl[1] - y)) === 1) el.classList.add("adj");
  if (c.open) {
    el.classList.add("open");
    if (c.n) {
      const v = experimental ? c.n - neighbors(x, y).filter(([a, b]) => grid[b][a].flag).length : c.n;
      el.textContent = v;
      el.classList.add(v < 0 ? "neg" : "n" + v);
    }
    if (c.t0) {
      const e = performance.now() - c.t0;
      if (e < c.d + 280) { el.classList.add("anim"); el.style.animationDelay = (c.d - e) + "ms"; }
      else c.t0 = 0;
    }
  } else if (c.flag) el.classList.add("flag");
}

// ---- mine finder: six rules, each can be switched off ----
const RULE_IDS = ["full", "satisfied", "subset", "overlap", "count", "enumerate"];
let rules = { full: true, satisfied: true, subset: true, overlap: true, count: true, enumerate: true };
try {
  const saved = JSON.parse(localStorage.getItem("mfRules"));
  if (saved) for (const id of RULE_IDS) if (typeof saved[id] === "boolean") rules[id] = saved[id];
} catch (e) {}

// Every opened number is a constraint: its closed neighbours hold exactly `need` mines.
// cons: [{S: Set of closed tile ids, S0: the same at the start, need, n: number shown, src: id of that number}]
// closed: ids of every closed tile, M: total mines. Returns {marks: Map(tile -> {kind, rule, info, nums}), capped}.
function infer(cons, closed, M, on) {
  const marks = new Map();
  let capped = false;
  const numsOf = t => cons.filter(k => k.S0.has(t)).map(k => k.src);
  let relabel = null;
  const mark = (t, kind, rule, info, nums) => {
    if (marks.has(t)) return false;
    if (relabel) { rule = relabel; info = {}; nums = numsOf(t); }
    marks.set(t, { kind, rule, info, nums });
    return true;
  };
  const snap = k => ({ n: k.n, need: k.need, size: k.S.size });

  const simple = on => {
    for (let changed = true; changed;) {
      changed = false;
      for (const k of cons) for (const t of [...k.S]) {
        const m = marks.get(t);
        if (m) { k.S.delete(t); if (m.kind === "mine") k.need--; }
      }
      const idx = new Map();
      for (const k of cons) for (const t of k.S) { if (!idx.has(t)) idx.set(t, []); idx.get(t).push(k); }
      for (const k of cons) {
        if (!k.S.size) continue;
        if (on.full && k.need === k.S.size) { for (const t of k.S) if (mark(t, "mine", "full", snap(k), [k.src])) changed = true; }
        else if (on.satisfied && k.need === 0) { for (const t of k.S) if (mark(t, "safe", "satisfied", snap(k), [k.src])) changed = true; }
      }
      if (on.subset || on.overlap) for (const A of cons) {
        if (!A.S.size) continue;
        const seen = new Set();
        for (const t of A.S) for (const B of idx.get(t)) {
          if (B === A || seen.has(B)) continue;
          seen.add(B);
          let I = 0;
          for (const u of A.S) if (B.S.has(u)) I++;
          const aOnly = A.S.size - I, bOnly = B.S.size - I;
          if (aOnly === 0 && bOnly > 0) {
            if (!on.subset) continue;
            const dn = B.need - A.need, info = { a: snap(A), b: snap(B), dn, size: bOnly };
            const D = [...B.S].filter(u => !A.S.has(u));
            if (dn === 0) { for (const u of D) if (mark(u, "safe", "subset", info, [A.src, B.src])) changed = true; }
            else if (dn === bOnly) { for (const u of D) if (mark(u, "mine", "subset", info, [A.src, B.src])) changed = true; }
          } else if (aOnly > 0 && bOnly > 0 && I > 0 && on.overlap && A.need - B.need === aOnly) {
            const info = { a: snap(A), b: snap(B), size: aOnly };
            for (const u of A.S) if (!B.S.has(u) && mark(u, "mine", "overlap", info, [A.src, B.src])) changed = true;
            for (const u of B.S) if (!A.S.has(u) && mark(u, "safe", "overlap", info, [A.src, B.src])) changed = true;
          }
        }
      }
      if (on.count) {
        let mc = 0;
        const unk = [];
        for (const t of closed) { const m = marks.get(t); if (!m) unk.push(t); else if (m.kind === "mine") mc++; }
        const rem = M - mc, info = { rem, unknown: unk.length };
        if (unk.length && rem === 0) { for (const t of unk) if (mark(t, "safe", "count", info, [])) changed = true; }
        else if (unk.length && rem === unk.length) { for (const t of unk) if (mark(t, "mine", "count", info, [])) changed = true; }
      }
    }
  };

  // lists every way to place mines on one linked group of tiles; capped so a huge open group cannot freeze the page
  const NODE_CAP = 250000;
  const solveGroup = (tiles, gcons) => {
    const adj = new Map(tiles.map(t => [t, []]));
    gcons.forEach((k, i) => { for (const t of k.S) adj.get(t).push(i); });
    const order = [], pos = new Set([tiles[0]]), queue = [tiles[0]];
    for (let q = 0; q < queue.length; q++) {
      const t = queue[q];
      order.push(t);
      for (const i of adj.get(t)) for (const u of gcons[i].S) if (!pos.has(u)) { pos.add(u); queue.push(u); }
    }
    const n = order.length, need = gcons.map(k => k.need), cm = gcons.map(() => 0), cr = gcons.map(k => k.S.size);
    const cl = order.map(t => adj.get(t));
    const assign = new Uint8Array(n), feasible = new Map();
    let nodes = 0, aborted = false;
    const rec = (p, k) => {
      if (aborted) return;
      if (++nodes > NODE_CAP) { aborted = true; return; }
      if (p === n) {
        let f = feasible.get(k);
        if (!f) { f = { mine: new Uint8Array(n), safe: new Uint8Array(n) }; feasible.set(k, f); }
        for (let i = 0; i < n; i++) (assign[i] ? f.mine : f.safe)[i] = 1;
        return;
      }
      for (let v = 0; v < 2; v++) {
        let ok = true;
        for (const c of cl[p]) { cm[c] += v; cr[c]--; }
        for (const c of cl[p]) if (cm[c] > need[c] || cm[c] + cr[c] < need[c]) { ok = false; break; }
        if (ok) { assign[p] = v; rec(p + 1, k + v); }
        for (const c of cl[p]) { cm[c] -= v; cr[c]++; }
      }
    };
    rec(0, 0);
    if (aborted) {
      capped = true;
      feasible.clear();
      for (let k = 0; k <= n; k++) feasible.set(k, { mine: new Uint8Array(n).fill(1), safe: new Uint8Array(n).fill(1) });
    }
    return { order, feasible };
  };

  const enumerate = () => {
    // quick clean-up first so big open groups shrink before listing; anything it finds is still a certainty of this rule
    relabel = "enumerate";
    simple({ full: true, satisfied: true, subset: true, overlap: true, count: true });
    relabel = null;
    const live = cons.filter(k => k.S.size);
    const parent = new Map();
    const find = t => { while (parent.get(t) !== t) { parent.set(t, parent.get(parent.get(t))); t = parent.get(t); } return t; };
    for (const k of live) for (const t of k.S) if (!parent.has(t)) parent.set(t, t);
    for (const k of live) { const first = find([...k.S][0]); for (const t of k.S) parent.set(find(t), first); }
    const groups = new Map();
    for (const t of parent.keys()) { const r = find(t); if (!groups.has(r)) groups.set(r, { tiles: [], cons: [] }); groups.get(r).tiles.push(t); }
    for (const k of live) groups.get(find([...k.S][0])).cons.push(k);
    let known = 0, unmarked = 0;
    for (const t of closed) { const m = marks.get(t); if (!m) unmarked++; else if (m.kind === "mine") known++; }
    const R = M - known, I = unmarked - parent.size;
    if (R < 0) return;
    const solved = [...groups.values()].map(g => solveGroup(g.tiles, g.cons));
    const zero = () => new Uint8Array(R + 1);
    const step = (from, ks) => { const out = zero(); for (let s = 0; s <= R; s++) if (from[s]) for (const k of ks) if (s + k <= R) out[s + k] = 1; return out; };
    const start = zero();
    start[0] = 1;
    const pre = [start];
    solved.forEach((g, i) => pre.push(step(pre[i], [...g.feasible.keys()])));
    const suf = new Array(solved.length + 1);
    suf[solved.length] = start;
    for (let i = solved.length - 1; i >= 0; i--) suf[i] = step(suf[i + 1], [...solved[i].feasible.keys()]);
    const all = pre[solved.length];
    // a group using k mines is possible if the rest of the board can supply a total that leaves 0..I mines for untouched tiles
    solved.forEach((g, gi) => {
      const others = zero();
      for (let a = 0; a <= R; a++) if (pre[gi][a]) for (let b = 0; a + b <= R; b++) if (suf[gi + 1][b]) others[a + b] = 1;
      const okK = new Map();
      for (const k of g.feasible.keys()) {
        let ok = false;
        for (let s = 0; s <= R && !ok; s++) if (others[s] && k + s <= R && R - (k + s) <= I) ok = true;
        okK.set(k, ok);
      }
      g.order.forEach((t, p) => {
        let canMine = false, canSafe = false;
        for (const [k, f] of g.feasible) if (okK.get(k)) { if (f.mine[p]) canMine = true; if (f.safe[p]) canSafe = true; }
        if (canMine && !canSafe) mark(t, "mine", "enumerate", {}, numsOf(t));
        else if (canSafe && !canMine) mark(t, "safe", "enumerate", {}, numsOf(t));
      });
    });
    if (I > 0) {
      let mineOk = false, safeOk = false;
      for (let s = 0; s <= R; s++) if (all[s]) { const ki = R - s; if (ki <= I) { if (ki >= 1) mineOk = true; if (ki <= I - 1) safeOk = true; } }
      for (const t of closed) if (!marks.has(t) && !parent.has(t)) {
        if (mineOk && !safeOk) mark(t, "mine", "enumerate", {}, []);
        else if (safeOk && !mineOk) mark(t, "safe", "enumerate", {}, []);
      }
    }
  };

  simple(on);
  if (on.enumerate) enumerate();
  return { marks, capped };
}

function solve() {
  const cons = [], closed = [];
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const c = grid[y][x];
    if (!c.open) { closed.push(y * W + x); continue; }
    if (!c.n) continue;
    const S = new Set();
    for (const [a, b] of neighbors(x, y)) if (!grid[b][a].open) S.add(b * W + a);
    if (S.size) cons.push({ S, S0: new Set(S), need: c.n, n: c.n, src: y * W + x });
  }
  return infer(cons, closed, M, rules);
}

function refreshMarks() {
  const next = view === "finder" && !over && started ? solve() : { marks: new Map(), capped: false }, old = marks;
  marks = next.marks;
  capped = next.capped;
  $("capnote").hidden = !capped;
  if (over) return;
  for (const k of new Set([...old.keys(), ...marks.keys()])) {
    const a = old.get(k), b = marks.get(k);
    if (!a || !b || a.kind !== b.kind) paint(k % W, Math.floor(k / W));
  }
  showWhy(whyTile);
}

// ---- the rules panel ----
const mg = (cols, str) => `<div class="mg" style="--cols:${cols}">` + str.split(" ").map(tk => {
  if (tk === "_") return '<i class="mt gap"></i>';
  if (tk === "#") return '<i class="mt"></i>';
  if (tk === ".") return '<i class="mt o"></i>';
  if (tk === "M") return '<i class="mt m"></i>';
  if (tk === "S") return '<i class="mt s"></i>';
  return `<i class="mt o n${tk}">${tk}</i>`;
}).join("") + "</div>";

const RULES = [
  { id: "full", name: "Full count", level: "Beginner",
    how: "If a number's closed tiles equal the number, they are all mines.",
    ex: mg(3, ". . . . 2 M . M .") },
  { id: "satisfied", name: "Satisfied", level: "Beginner",
    how: "If a number already has its mines, its other closed tiles are safe.",
    ex: mg(3, ". . . M 1 S . . .") },
  { id: "subset", name: "Subset", level: "Medium",
    how: "One number's tiles sit inside another's. The leftover tiles hold the difference: all mines, or none if it is zero. Here the 1 sits inside the 2, so the last tile is a mine.",
    ex: mg(3, "1 2 _ # # M") },
  { id: "overlap", name: "Overlap", level: "Advanced",
    how: "Two numbers share tiles. If one needs as many more mines as it has tiles of its own, those are all mines and the other's own tiles are safe. Here 3 in 4 tiles and 1 in 3 forces the first two.",
    ex: '<div class="mg" style="--cols:5"><i class="mt m"></i><i class="mt m"></i><i class="mt"></i><i class="mt"></i><i class="mt s"></i><div class="eb a" style="grid-column:1/5">3 mines</div><div class="eb b" style="grid-column:3/6">1 mine</div></div>' },
  { id: "count", name: "Mine count", level: "Medium",
    how: "If the mines left equal the unknown tiles, they are all mines. If none are left, they are all safe.",
    ex: mg(2, "M M") + '<div class="chip">2 mines left, 2 tiles</div>' },
  { id: "enumerate", name: "Every layout", level: "Expert",
    how: "List every layout that fits the numbers and the total. A tile that is always a mine is certain. One that is never a mine is safe. This catches everything above.",
    ex: '<div class="mg" style="--cols:4"><i class="mt m">a</i><i class="mt s">b</i><i class="mt s">c</i><i class="mt m">d</i></div><div class="chip">2 in a, b, d</div> <div class="chip">1 in a, c</div> <div class="chip">1 in c, d</div><p>If c were a mine, a and d could not be, and the 2 would get just 1. So c is safe.</p>' },
];

function buildRules() {
  const list = $("rulelist");
  list.innerHTML = "";
  RULES.forEach((r, i) => {
    const el = document.createElement("div");
    el.className = "rule" + (rules[r.id] ? " on" : "");
    el.innerHTML = `<button class="rbox"><b>${i + 1}</b><span>${r.name}</span><em>${r.level}</em></button>
      <details><summary>How it works</summary><div class="lesson"><p>${r.how}</p>${r.ex}</div></details>`;
    el.querySelector(".rbox").onclick = () => {
      rules[r.id] = !rules[r.id];
      el.classList.toggle("on", rules[r.id]);
      try { localStorage.setItem("mfRules", JSON.stringify(rules)); } catch (err) {}
      refreshMarks();
    };
    list.appendChild(el);
  });
}

function setDrawer(open) { $("rules").classList.toggle("open", open); }

const pl = (n, w) => n + " " + w + (n === 1 ? "" : "s");
function whyText(mk) {
  const i = mk.info, mine = mk.kind === "mine";
  switch (mk.rule) {
    case "full": return `This ${i.n} needs ${i.need} more and has ${pl(i.size, "closed tile")}: all mines.`;
    case "satisfied": return `This ${i.n} has all its mines, so the rest are safe.`;
    case "subset": return `The ${i.a.n} sits inside the ${i.b.n}. The other ${pl(i.size, "tile")} ${i.size === 1 ? "has" : "have"} ${i.dn}: ` + (mine ? "all mines." : "safe.");
    case "overlap": return `The ${i.a.n} needs ${i.size} more than the ${i.b.n} and has ${pl(i.size, "tile")} only it touches: ` + (mine ? "all mines." : "so the other's own tiles are safe.");
    case "count": return mine ? `${pl(i.rem, "mine")} left, ${pl(i.unknown, "unknown tile")}: all mines.` : "No mines left, so these are safe.";
    default: return mine ? "A mine in every layout that fits." : "Never a mine in any layout that fits.";
  }
}

function showWhy(t) {
  whyTile = t;
  const mk = t && view === "finder" && !over ? marks.get(t[1] * W + t[0]) : null;
  const old = whySet;
  whySet = new Set(mk ? mk.nums : []);
  if (!over) for (const k of new Set([...old, ...whySet])) if (old.has(k) !== whySet.has(k)) paint(k % W, Math.floor(k / W));
  const r = mk && RULES.find(x => x.id === mk.rule);
  $("why").innerHTML = mk ? `<b>${mk.kind === "mine" ? "Mine" : "Safe"} · ${r.name}</b><br>${whyText(mk)}` : "Hover a mark to see why.";
}

// opens tiles breadth first; each tile's delay grows with its distance so the clear ripples outward
function reveal(x, y) {
  const q = [[x, y, 0]], now = performance.now();
  for (let i = 0; i < q.length; i++) {
    const [cx, cy, d] = q[i], c = grid[cy][cx];
    if (c.open || c.flag) continue;
    c.open = true; revealed++;
    c.d = Math.min(d * 35, 800); c.t0 = now;
    paint(cx, cy);
    if (!c.n) for (const [nx, ny] of neighbors(cx, cy)) q.push([nx, ny, d + 1]);
  }
  if (view === "finder") refreshMarks();
}

function dig(x, y) {
  if (over) return;
  const c = grid[y][x];
  if (c.flag) return;
  if (c.open) return chord(x, y);
  if (!started) plant(x, y);
  if (c.mine) return lose(x, y);
  reveal(x, y);
  if (revealed === W * H - M) win();
}

function chord(x, y) {
  const c = grid[y][x];
  const ns = neighbors(x, y);
  if (!c.n || ns.filter(([a, b]) => grid[b][a].flag).length !== c.n) return;
  for (const [a, b] of ns) {
    const t = grid[b][a];
    if (t.flag || t.open) continue;
    if (t.mine) return lose(a, b);
    reveal(a, b);
  }
  if (revealed === W * H - M) win();
}

function flag(x, y) {
  if (over) return;
  const c = grid[y][x];
  if (c.open) return;
  c.flag = !c.flag;
  flags += c.flag ? 1 : -1;
  $("mines").textContent = pad(M - flags);
  paint(x, y);
  if (experimental) for (const [a, b] of neighbors(x, y)) if (grid[b][a].open) paint(a, b);
}

function lose(bx, by) {
  over = true; endHover(); clearInterval(timer);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const c = grid[y][x], el = cells[y][x];
    if (c.mine && !c.flag) { el.className = "c open mine"; el.style.setProperty("--md", Math.min(Math.hypot(x - bx, y - by) * 45, 900) + "ms"); }
    else if (!c.mine && c.flag) el.className = "c open wrong";
  }
  cells[by][bx].className = "c open mine boom";
  $("msg").textContent = "Boom. Game over"; $("msg").className = "lose";
}

function win() {
  over = true; endHover(); clearInterval(timer);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const c = grid[y][x];
    if (c.mine && !c.flag) { c.flag = true; paint(x, y); }
    if (c.mine) cells[y][x].classList.add("win");
  }
  if (experimental) for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (grid[y][x].open) paint(x, y);
  $("mines").textContent = "000";
  $("msg").textContent = `Cleared in ${secs}s`; $("msg").className = "win";
}

function setHl(pos) {
  const old = hl;
  hl = pos;
  if (over) return;
  for (const p of [old, pos]) {
    if (!p) continue;
    for (let y = p[1] - 1; y <= p[1] + 1; y++) for (let x = p[0] - 1; x <= p[0] + 1; x++)
      if (x >= 0 && y >= 0 && x < W && y < H) paint(x, y);
  }
}

// the tiles around a tile light up while the middle button is held, or while hovering with hover chord on
function refreshHl() {
  const want = midHeld ? midPos : (autoChord ? hover : null);
  if (want === hl || (want && hl && want[0] === hl[0] && want[1] === hl[1])) return;
  setHl(want);
}

function setHover(pos) { hover = pos; refreshHl(); }

function endHover() {
  hover = hl = null; midHeld = false;
  boardEl.querySelectorAll(".adj").forEach(el => el.classList.remove("adj"));
}

function hoverChord() {
  if (!autoChord || over || !hover || !grid[hover[1]][hover[0]].open) return;
  chord(...hover);
}

// input: left click, right click, long press for touch
let pressTimer = null, longFired = false;
function target(e) { const t = e.target.closest(".c"); return t ? [+t.dataset.x, +t.dataset.y] : null; }

boardEl.addEventListener("contextmenu", e => {
  e.preventDefault();
  const t = target(e); if (t) { flag(...t); hoverChord(); }
});
boardEl.addEventListener("pointerover", e => {
  if (e.pointerType !== "mouse") return;
  const t = target(e);
  if (t) { if (midHeld) midPos = t; setHover(t); showWhy(t); hoverChord(); }
});
boardEl.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") { setHover(null); showWhy(null); } });
boardEl.addEventListener("mousedown", e => {
  if (e.button !== 1) return;
  e.preventDefault();
  const t = target(e);
  if (t) { midHeld = true; midPos = t; refreshHl(); }
});
window.addEventListener("mouseup", e => { if (e.button === 1) { midHeld = false; refreshHl(); } });
boardEl.addEventListener("auxclick", e => {
  if (e.button !== 1) return;
  e.preventDefault();
  const t = target(e);
  if (t && !over && grid[t[1]][t[0]].open) chord(...t);
});
boardEl.addEventListener("pointerdown", e => {
  if (e.pointerType === "mouse") return;
  const t = target(e); if (!t) return;
  longFired = false;
  pressTimer = setTimeout(() => { longFired = true; flag(...t); if (navigator.vibrate) navigator.vibrate(20); }, 380);
});
["pointerup", "pointercancel", "pointermove"].forEach(ev =>
  boardEl.addEventListener(ev, () => clearTimeout(pressTimer)));
boardEl.addEventListener("click", e => {
  if (longFired) { longFired = false; return; }
  const t = target(e);
  if (t) { dig(...t); if (e.pointerType !== 'touch' && e.detail) hoverChord(); }
});
$("face").onclick = reset;
$("gear").onclick = () => { $("panel").hidden = !$("panel").hidden; };
document.addEventListener("click", e => { if (!e.target.closest(".settings")) $("panel").hidden = true; });
document.addEventListener("keydown", e => { if (e.key === "Escape") { $("panel").hidden = true; setDrawer(false); } });
try { autoChord = localStorage.getItem("autochord") === "1"; } catch (e) {}
$("autochord").classList.toggle("on", autoChord);
$("rtab").onclick = () => setDrawer(!$("rules").classList.contains("open"));
$("autochord").onclick = () => {
  autoChord = !autoChord;
  $("autochord").classList.toggle("on", autoChord);
  try { localStorage.setItem("autochord", autoChord ? "1" : "0"); } catch (err) {}
  refreshHl();
  hoverChord();
};
document.addEventListener("keydown", e => { if (e.key === "r" || e.key === "R") reset(); });

buildTabs();
buildModes();
buildRules();
reset();
</script>
</body>
</html>
