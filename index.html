<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Minesweeper</title>
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --cell: #1c1c1c;
    --cell-hover: #282828;
    --line: #2a2a2a;
    --text: #f5f5f2;
    --dim: #77776f;
    --accent: #d4af37;
    --red: #c23b32;
    --green: #4caf6b;
    --num: ui-monospace, "Cascadia Mono", Consolas, "SF Mono", monospace;
    --size: 36px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Inter", "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 40px 12px 40px;
    user-select: none; -webkit-user-select: none;
  }
  .wrap { display: flex; flex-direction: column; align-items: stretch; max-width: 100%; }
  h1 { text-align: center; margin: 0 0 20px; font-size: 1.05rem; font-weight: 600; letter-spacing: -.01em; }
  h1 span { color: var(--dim); font-weight: 500; }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 14px; flex-wrap: wrap; }
  .tabs { display: flex; justify-content: center; gap: 22px; margin-bottom: 18px; border-bottom: 1px solid var(--line); }
  .tabs button { font: inherit; font-size: .85rem; font-weight: 500; color: var(--dim); background: none; border: 0; padding: 0 0 10px; margin-bottom: -1px; cursor: pointer; border-bottom: 2px solid transparent; transition: color .15s; }
  .tabs button:hover { color: var(--text); }
  .tabs button.on { color: var(--text); border-bottom-color: var(--accent); }
  .modes { display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
  .modes button {
    font: inherit; font-size: .8rem; font-weight: 500; color: var(--dim); background: none;
    border: 0; border-radius: 7px; padding: 6px 14px; cursor: pointer; transition: color .15s, background .15s;
  }
  .modes button:hover { color: var(--text); }
  .modes button.on { color: var(--text); background: var(--cell-hover); }
  .stats { display: flex; align-items: center; gap: 18px; font-size: .85rem; color: var(--dim); font-variant-numeric: tabular-nums; }
  .stats b { color: var(--text); font-weight: 600; margin-left: 6px; }
  #face {
    font: inherit; font-size: .8rem; font-weight: 500; color: var(--bg); background: var(--text);
    border: 0; border-radius: 8px; padding: 6px 14px; cursor: pointer; transition: opacity .15s;
  }
  #face:hover { opacity: .85; }
  .scroller { align-self: center; width: fit-content; max-width: 100%; overflow: auto; padding: 10px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); }
  #board { display: grid; gap: 3px; touch-action: manipulation; }
  .c {
    position: relative; width: var(--size); height: var(--size); border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--num); font-weight: 700; font-size: calc(var(--size) * .5); font-variant-numeric: tabular-nums;
    background: var(--cell); cursor: pointer; transition: background .12s;
  }
  .c:hover:not(.open) { background: var(--cell-hover); }
  .c.open { background: transparent; cursor: default; }
  .c.adj:not(.open) { background: #242116; box-shadow: inset 0 0 0 1px rgba(212,175,55,.22); }
  .c.adj.open { background: rgba(212,175,55,.05); }
  #gear { font: inherit; font-size: .78rem; color: var(--dim); background: none; border: 0; padding: 0; margin: 14px auto 0; cursor: pointer; }
  #gear:hover { color: var(--text); }
  #panel { margin-top: 10px; align-self: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .opt { display: flex; align-items: center; gap: 12px; cursor: pointer; font-size: .85rem; }
  .opt small { display: block; color: var(--dim); font-size: .72rem; margin-top: 2px; }
  .opt input { position: absolute; opacity: 0; pointer-events: none; }
  .opt i { position: relative; flex: none; width: 34px; height: 20px; border-radius: 10px; background: var(--cell-hover); transition: background .15s; }
  .opt i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--text); transition: transform .15s; }
  .opt input:checked + i { background: var(--accent); }
  .opt input:checked + i::after { transform: translateX(14px); background: var(--bg); }
  .opt input:focus-visible + i { outline: 2px solid var(--accent); outline-offset: 2px; }
  .c.flag::before {
    content: ""; width: 0; height: 0; margin-left: 3px;
    border-left: 11px solid var(--accent); border-top: 6px solid transparent; border-bottom: 6px solid transparent;
  }
  .c.flag::after { content: ""; position: absolute; width: 2px; height: 16px; background: var(--accent); left: calc(50% - 7px); top: calc(50% - 8px); border-radius: 1px; }
  .c.mine::before { content: ""; width: 38%; height: 38%; border-radius: 50%; background: var(--red); }
  .c.boom { background: rgba(194,59,50,.3); }
  .c.wrong::before { content: ""; width: 38%; height: 2px; background: var(--red); transform: rotate(-45deg); }
  .c.wrong::after { content: ""; position: absolute; width: 38%; height: 2px; background: var(--red); transform: rotate(45deg); }
  .c.wrong { background: rgba(194,59,50,.12); }
  .c.win.flag::before { border-left-color: var(--green); }
  .c.win.flag::after { background: var(--green); }
  .n1 { color: #6ea8ff; } .n2 { color: #5fd39a; } .n3 { color: #ff7a7a; } .n4 { color: #b394ff; }
  .n0 { color: #3a3a36; } .neg { color: var(--red); }
  .n5 { color: #ffb86b; } .n6 { color: #5fd3d3; } .n7 { color: #e5e5ea; } .n8 { color: #8a8a96; }
  #msg { text-align: center; height: 1.4em; margin-top: 14px; font-size: .85rem; font-weight: 500; color: var(--dim); }
  #msg.win { color: var(--green); }
  #msg.lose { color: var(--red); }
  .hint { width: 0; min-width: 100%; text-align: center; margin-top: 4px; color: var(--dim); font-size: .75rem; opacity: .7; }
  @media (max-width: 520px) { :root { --size: 30px; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>minesweeper</h1>
  <div class="tabs" id="tabs"></div>
  <div class="bar">
    <div class="modes" id="modes"></div>
    <div class="stats">
      <span>Mines<b id="mines">010</b></span>
      <span>Time<b id="time">000</b></span>
      <button id="face">New game</button>
    </div>
  </div>
  <div class="scroller"><div id="board"></div></div>
  <div id="msg"></div>
  <button id="gear">Settings</button>
  <div id="panel" hidden>
    <label class="opt"><input type="checkbox" id="autochord"><i></i>
      <span>Hover chord<small>Acts like the middle button is always held: hovering highlights the tiles around it and clears a satisfied number.</small></span></label>
  </div>
  <div class="hint" id="exp" hidden>Experimental: placing a flag subtracts 1 from every number around it. A 0 means that number is satisfied.</div>
  <div class="hint">Click to dig. Right-click or long-press to flag. Middle-click a number to clear around it (hold to highlight around any tile). R restarts.</div>
</div>

<script>
const MODES = {
  Easy:   { w: 9,  h: 9,  m: 10 },
  Medium: { w: 16, h: 16, m: 40 },
  Hard:   { w: 30, h: 16, m: 99 },
};
let experimental = false, autoChord = false, hover = null, hl = null, midPos = null, midHeld = false, mode = "Easy", W, H, M, grid, cells, started, over, flags, revealed, timer, secs;

const $ = id => document.getElementById(id);
const boardEl = $("board");

function pad(n) { return String(Math.max(0, Math.min(999, n))).padStart(3, "0"); }

function buildTabs() {
  $("tabs").innerHTML = "";
  [["Classic", false], ["Experimental", true]].forEach(([name, exp]) => {
    const b = document.createElement("button");
    b.textContent = name;
    b.className = exp === experimental ? "on" : "";
    b.onclick = () => { experimental = exp; buildTabs(); $("exp").hidden = !exp; reset(); };
    $("tabs").appendChild(b);
  });
}

function buildModes() {
  $("modes").innerHTML = "";
  for (const name in MODES) {
    const b = document.createElement("button");
    b.textContent = name;
    b.className = name === mode ? "on" : "";
    b.onclick = () => { mode = name; buildModes(); reset(); };
    $("modes").appendChild(b);
  }
}

function reset() {
  ({ w: W, h: H, m: M } = MODES[mode]);
  clearInterval(timer);
  hover = hl = midPos = null; midHeld = false;
  secs = 0; started = false; over = false; flags = 0; revealed = 0;
  grid = Array.from({ length: H }, () => Array.from({ length: W }, () => ({ mine: false, n: 0, open: false, flag: false })));
  boardEl.style.gridTemplateColumns = `repeat(${W}, var(--size))`;
  boardEl.innerHTML = "";
  cells = [];
  for (let y = 0; y < H; y++) {
    cells.push([]);
    for (let x = 0; x < W; x++) {
      const el = document.createElement("div");
      el.className = "c";
      el.dataset.x = x; el.dataset.y = y;
      boardEl.appendChild(el);
      cells[y].push(el);
    }
  }
  $("time").textContent = "000";
  $("mines").textContent = pad(M);
  $("msg").textContent = ""; $("msg").className = "";
}

function neighbors(x, y) {
  const out = [];
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
    if (!dx && !dy) continue;
    const nx = x + dx, ny = y + dy;
    if (nx >= 0 && ny >= 0 && nx < W && ny < H) out.push([nx, ny]);
  }
  return out;
}

function plant(sx, sy) {
  const safe = new Set([sx + "," + sy, ...neighbors(sx, sy).map(([a, b]) => a + "," + b)]);
  let placed = 0;
  while (placed < M) {
    const x = Math.floor(Math.random() * W), y = Math.floor(Math.random() * H);
    if (grid[y][x].mine || safe.has(x + "," + y)) continue;
    grid[y][x].mine = true; placed++;
  }
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++)
    grid[y][x].n = neighbors(x, y).filter(([a, b]) => grid[b][a].mine).length;
  timer = setInterval(() => { secs++; $("time").textContent = pad(secs); }, 1000);
  started = true;
}

function paint(x, y) {
  const c = grid[y][x], el = cells[y][x];
  el.className = "c";
  el.textContent = "";
  if (hl && Math.max(Math.abs(hl[0] - x), Math.abs(hl[1] - y)) === 1) el.classList.add("adj");
  if (c.open) {
    el.classList.add("open");
    if (c.n) {
      const v = experimental ? c.n - neighbors(x, y).filter(([a, b]) => grid[b][a].flag).length : c.n;
      el.textContent = v;
      el.classList.add(v < 0 ? "neg" : "n" + v);
    }
  } else if (c.flag) el.classList.add("flag");
}

function reveal(x, y) {
  const stack = [[x, y]];
  while (stack.length) {
    const [cx, cy] = stack.pop(), c = grid[cy][cx];
    if (c.open || c.flag) continue;
    c.open = true; revealed++;
    paint(cx, cy);
    if (!c.n) for (const [nx, ny] of neighbors(cx, cy)) stack.push([nx, ny]);
  }
}

function dig(x, y) {
  if (over) return;
  const c = grid[y][x];
  if (c.flag) return;
  if (c.open) return chord(x, y);
  if (!started) plant(x, y);
  if (c.mine) return lose(x, y);
  reveal(x, y);
  if (revealed === W * H - M) win();
}

function chord(x, y) {
  const c = grid[y][x];
  const ns = neighbors(x, y);
  if (!c.n || ns.filter(([a, b]) => grid[b][a].flag).length !== c.n) return;
  for (const [a, b] of ns) {
    const t = grid[b][a];
    if (t.flag || t.open) continue;
    if (t.mine) return lose(a, b);
    reveal(a, b);
  }
  if (revealed === W * H - M) win();
}

function flag(x, y) {
  if (over) return;
  const c = grid[y][x];
  if (c.open) return;
  c.flag = !c.flag;
  flags += c.flag ? 1 : -1;
  $("mines").textContent = pad(M - flags);
  paint(x, y);
  if (experimental) for (const [a, b] of neighbors(x, y)) if (grid[b][a].open) paint(a, b);
}

function lose(bx, by) {
  over = true; endHover(); clearInterval(timer);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const c = grid[y][x], el = cells[y][x];
    if (c.mine && !c.flag) el.className = "c open mine";
    else if (!c.mine && c.flag) el.className = "c open wrong";
  }
  cells[by][bx].className = "c open mine boom";
  $("msg").textContent = "Boom. Game over"; $("msg").className = "lose";
}

function win() {
  over = true; endHover(); clearInterval(timer);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const c = grid[y][x];
    if (c.mine && !c.flag) { c.flag = true; paint(x, y); }
    if (c.mine) cells[y][x].classList.add("win");
  }
  if (experimental) for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (grid[y][x].open) paint(x, y);
  $("mines").textContent = "000";
  $("msg").textContent = `Cleared in ${secs}s`; $("msg").className = "win";
}

function setHl(pos) {
  const old = hl;
  hl = pos;
  if (over) return;
  for (const p of [old, pos]) {
    if (!p) continue;
    for (let y = p[1] - 1; y <= p[1] + 1; y++) for (let x = p[0] - 1; x <= p[0] + 1; x++)
      if (x >= 0 && y >= 0 && x < W && y < H) paint(x, y);
  }
}

// the tiles around a tile light up while the middle button is held, or while hovering with hover chord on
function refreshHl() {
  const want = midHeld ? midPos : (autoChord ? hover : null);
  if (want === hl || (want && hl && want[0] === hl[0] && want[1] === hl[1])) return;
  setHl(want);
}

function setHover(pos) { hover = pos; refreshHl(); }

function endHover() {
  hover = hl = null; midHeld = false;
  boardEl.querySelectorAll(".adj").forEach(el => el.classList.remove("adj"));
}

function hoverChord() {
  if (!autoChord || over || !hover || !grid[hover[1]][hover[0]].open) return;
  chord(...hover);
}

// input: left click, right click, long press for touch
let pressTimer = null, longFired = false;
function target(e) { const t = e.target.closest(".c"); return t ? [+t.dataset.x, +t.dataset.y] : null; }

boardEl.addEventListener("contextmenu", e => {
  e.preventDefault();
  const t = target(e); if (t) { flag(...t); hoverChord(); }
});
boardEl.addEventListener("pointerover", e => {
  if (e.pointerType !== "mouse") return;
  const t = target(e);
  if (t) { if (midHeld) midPos = t; setHover(t); hoverChord(); }
});
boardEl.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") setHover(null); });
boardEl.addEventListener("mousedown", e => {
  if (e.button !== 1) return;
  e.preventDefault();
  const t = target(e);
  if (t) { midHeld = true; midPos = t; refreshHl(); }
});
window.addEventListener("mouseup", e => { if (e.button === 1) { midHeld = false; refreshHl(); } });
boardEl.addEventListener("auxclick", e => {
  if (e.button !== 1) return;
  e.preventDefault();
  const t = target(e);
  if (t && !over && grid[t[1]][t[0]].open) chord(...t);
});
boardEl.addEventListener("pointerdown", e => {
  if (e.pointerType === "mouse") return;
  const t = target(e); if (!t) return;
  longFired = false;
  pressTimer = setTimeout(() => { longFired = true; flag(...t); if (navigator.vibrate) navigator.vibrate(20); }, 380);
});
["pointerup", "pointercancel", "pointermove"].forEach(ev =>
  boardEl.addEventListener(ev, () => clearTimeout(pressTimer)));
boardEl.addEventListener("click", e => {
  if (longFired) { longFired = false; return; }
  const t = target(e);
  if (t) { dig(...t); if (e.pointerType !== 'touch' && e.detail) hoverChord(); }
});
$("face").onclick = reset;
$("gear").onclick = () => { $("panel").hidden = !$("panel").hidden; };
try { autoChord = localStorage.getItem("autochord") === "1"; } catch (e) {}
$("autochord").checked = autoChord;
$("autochord").onchange = e => {
  autoChord = e.target.checked;
  try { localStorage.setItem("autochord", autoChord ? "1" : "0"); } catch (err) {}
  refreshHl();
  hoverChord();
};
document.addEventListener("keydown", e => { if (e.key === "r" || e.key === "R") reset(); });

buildTabs();
buildModes();
reset();
</script>
</body>
</html>
